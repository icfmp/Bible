name: Verify ZIP YVES conversion inside the installed Flatpak
on:
  push:
    branches: [feat/26-yves-fidelity, feat/26-youversion-language-catalogue]
  workflow_dispatch:
    inputs:
      runtime_probe:
        description: Run the isolated rendering diagnosis with the installed GTK runtime
        type: boolean
        default: false
      candidate_run:
        description: Optional successful ordinary CI run for this exact source; install its actual bundle instead of mounting development code
        type: string
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  proof:
    if: ${{ inputs.runtime_probe != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Wait for the ordinary checks of this exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            run=$(gh api 'repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=100' --jq '.workflow_runs[] | select(.name=="Vérifier le socle GNOME" and .event=="push") | [.id,.status,(.conclusion // "pending")] | @tsv' | head -1)
            if [ -n "$run" ]; then
              read -r build_run status conclusion <<< "$run"
              if [ "$status" = completed ]; then test "$conclusion" = success; break; fi
            fi
            sleep 20
          done
          test "${conclusion:-pending}" = success
          gh run download "$build_run" --repo '${{ github.repository }}' --name Bible-alpha-linux-x86_64 --dir "$RUNNER_TEMP/bundle"
          python3 - "$RUNNER_TEMP/bundle" <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          p=Path(sys.argv[1]);x=json.loads((p/'build-info.json').read_text())
          assert x['commit']==os.environ['GITHUB_SHA']
          assert hashlib.sha256((p/'Bible-alpha.flatpak').read_bytes()).hexdigest()==x['sha256']
          PY
      - name: Install validation tools and the actual feature-branch package
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update -qq
          sudo apt-get install -y flatpak xvfb xauth dbus-x11 fonts-noto-cjk
          echo "FLATPAK_USER_DIR=$RUNNER_TEMP/yves-flatpak" >> "$GITHUB_ENV"
          FLATPAK_USER_DIR="$RUNNER_TEMP/yves-flatpak" flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          FLATPAK_USER_DIR="$RUNNER_TEMP/yves-flatpak" flatpak install --user --noninteractive "$RUNNER_TEMP/bundle/Bible-alpha.flatpak"
          mkdir reports
          cp "$RUNNER_TEMP/bundle/build-info.json" reports/
      - name: Run synthetic source and hostile-archive checks
        run: python3 -m unittest tools.research.test_yves_source -v
      - name: Obtain an isolated pinned research-only DOM oracle
        run: |
          python3 - "$RUNNER_TEMP/research-python" <<'PY'
          import hashlib,io,sys,urllib.request,zipfile
          from pathlib import Path
          url='https://files.pythonhosted.org/packages/ac/7d/8bf1fd8bae8247743968bb76d027a1ac5bd2c4b44495fba6a71b30d10706/lxml-6.1.3-cp313-cp313-manylinux_2_26_x86_64.manylinux_2_28_x86_64.whl'
          data=urllib.request.urlopen(url,timeout=45).read()
          assert hashlib.sha256(data).hexdigest()=='d85dfab42dd672f87a7f76e9de7172962aee69fa12044f0d6e1a23cbd53fb80e'
          # Validated trusted wheel only; this is never an application dependency.
          out=Path(sys.argv[1]);out.mkdir()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for m in z.infolist():assert (out/m.filename).resolve().is_relative_to(out.resolve())
              z.extractall(out)
          PY
      - name: Verify the independent native-fragment oracle
        run: |
          flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP":ro --env=PYTHONPATH="/app/lib/bible-python:$PWD:$RUNNER_TEMP/research-python" --command=python3 io.github.icfmp.Bible//master -m unittest tools.research.test_yves_fidelity -v
      - name: Synthetic conversion and offline GTK readback with the packaged compiler
        run: |
          timeout 120s dbus-run-session -- xvfb-run -a flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=cairo --command=python3 io.github.icfmp.Bible//master -m tools.research.check_yves_pipeline "$RUNNER_TEMP/synthetic-proof" --compiler /app/bin/osis2mod --gtk --require-packaged
          cp "$RUNNER_TEMP/synthetic-proof/verification.json" reports/synthetic.json
      - name: Fetch the requested research material through the returned offline URL
        run: python3 -m tools.research.fetch_yves_probe "$RUNNER_TEMP/private-yves-input"
      - name: Verify actual edition samples offline in the installed application
        run: |
          timeout 180s dbus-run-session -- xvfb-run -a flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD:$RUNNER_TEMP/research-python" --env=GSK_RENDERER=cairo --command=python3 io.github.icfmp.Bible//master -m tools.research.check_yves_samples "$RUNNER_TEMP/private-yves-input/source.zip" --metadata "$RUNNER_TEMP/private-yves-input/metadata.json" --compiler /app/bin/osis2mod --output "$RUNNER_TEMP/private-real-proof" --gtk --require-packaged
          cp "$RUNNER_TEMP/private-real-proof/verification.json" reports/real-samples.json
      - name: Verify difficult source structures and linked units in installed GTK
        run: |
          timeout 240s dbus-run-session -- xvfb-run -a flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD:$RUNNER_TEMP/research-python" --command=python3 io.github.icfmp.Bible//master -m tools.research.check_yves_samples "$RUNNER_TEMP/private-yves-input/source.zip" --metadata "$RUNNER_TEMP/private-yves-input/metadata.json" --compiler /app/bin/osis2mod --output "$RUNNER_TEMP/private-extended-proof" --extended --gtk --require-packaged
          cp "$RUNNER_TEMP/private-extended-proof/verification.json" reports/raw-extended.json
      - name: Download and verify legacy and newly discovered editions inside the installed application
        run: |
          for edition in 21 93 64 131 1 12 3034 504 149 36 13 2599 478; do
            retained=()
            if [ "$edition" = 21 ]; then
              retained=("$RUNNER_TEMP/private-yves-input/source.zip" --metadata "$RUNNER_TEMP/private-yves-input/metadata.json")
            fi
            timeout 360s dbus-run-session -- xvfb-run -a flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD:$RUNNER_TEMP/research-python" --env=GSK_RENDERER=cairo --command=python3 io.github.icfmp.Bible//master -m tools.research.check_youversion_install "${retained[@]}" --version "$edition" --output "$RUNNER_TEMP/private-seven-proof/online-$edition" --shared-profile --independent --gtk --require-packaged
            cp "$RUNNER_TEMP/private-seven-proof/online-$edition/verification.json" "reports/installed-$edition.json"
            timeout 240s dbus-run-session -- xvfb-run -a flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=cairo --command=python3 io.github.icfmp.Bible//master -m tools.research.check_youversion_install --version "$edition" --output "$RUNNER_TEMP/private-seven-proof/offline-$edition" --shared-profile --verify-only --gtk --require-packaged
            cp "$RUNNER_TEMP/private-seven-proof/offline-$edition/verification.json" "reports/offline-$edition.json"
          done
      - name: Capture actual packaged language catalogues and offline reading
        run: |
          timeout 180s dbus-run-session -- xvfb-run -a -s '-screen 0 1200x850x24' flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=cairo --env=LANGUAGE=fr --command=python3 io.github.icfmp.Bible//master -m tools.research.check_youversion_languages_ui "$RUNNER_TEMP/private-seven-proof/shared-proof-profile" "$RUNNER_TEMP/language-captures" --require-packaged
          cp -r "$RUNNER_TEMP/language-captures" reports/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yves-conversion-statistics
          path: reports/
          if-no-files-found: warn

  runtime-rendering-probe:
    if: ${{ inputs.runtime_probe == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install the previously verified package in an isolated deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y flatpak xvfb xauth dbus-x11
          echo "FLATPAK_USER_DIR=$RUNNER_TEMP/rendering-flatpak" >> "$GITHUB_ENV"
          gh run download 41391340612 --repo '${{ github.repository }}' --name Bible-alpha-linux-x86_64 --dir "$RUNNER_TEMP/bundle"
          FLATPAK_USER_DIR="$RUNNER_TEMP/rendering-flatpak" flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          FLATPAK_USER_DIR="$RUNNER_TEMP/rendering-flatpak" flatpak install --user --noninteractive "$RUNNER_TEMP/bundle/Bible-alpha.flatpak"
      - name: Capture the packaged baseline using real resources
        run: |
          timeout 300s dbus-run-session -- xvfb-run -a -s '-screen 0 1200x850x24' flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --command=python3 io.github.icfmp.Bible//master -m tools.check_source_rendering "$RUNNER_TEMP/research-profile" "$RUNNER_TEMP/rendering-before" --prepare --baseline --require-packaged
      - name: Capture baseline reader and Library chrome
        run: |
          for tool in check_reader_chrome check_library_categories check_commentary_context check_followup_surfaces; do
            extra=()
            if [ "$tool" = check_followup_surfaces ]; then extra=(--maps); fi
            timeout 240s dbus-run-session -- xvfb-run -a -s '-screen 0 1200x850x24' flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=LANGUAGE=fr_FR --command=python3 io.github.icfmp.Bible//master -m "tools.$tool" "$RUNNER_TEMP/research-profile" "$RUNNER_TEMP/rendering-before/$tool" --baseline --require-packaged "${extra[@]}"
          done
      - name: Prepare actual Semeur and English search baselines
        run: |
          timeout 360s dbus-run-session -- xvfb-run -a -s '-screen 0 1200x850x24' flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=LANGUAGE=fr_FR --command=python3 io.github.icfmp.Bible//master -m tools.check_quotation_search "$RUNNER_TEMP/research-profile" "$RUNNER_TEMP/rendering-before/quotations" --baseline --require-packaged --prepare
      - name: Install the exact successful candidate when requested
        if: ${{ inputs.candidate_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/${{ github.repository }}/actions/runs/$CANDIDATE_RUN" > "$RUNNER_TEMP/candidate-run.json"
          python3 - "$RUNNER_TEMP/candidate-run.json" <<'PY'
          import json,os,sys
          x=json.load(open(sys.argv[1]))
          assert x['head_sha']==os.environ['GITHUB_SHA']
          assert x['name']=='Vérifier le socle GNOME' and x['event']=='push'
          assert x['status']=='completed' and x['conclusion']=='success'
          PY
          gh run download "$CANDIDATE_RUN" --repo '${{ github.repository }}' --name Bible-alpha-linux-x86_64 --dir "$RUNNER_TEMP/candidate-bundle"
          python3 - "$RUNNER_TEMP/candidate-bundle" <<'PY'
          import hashlib,json,os,sys
          from pathlib import Path
          p=Path(sys.argv[1]);x=json.loads((p/'build-info.json').read_text())
          assert x['commit']==os.environ['GITHUB_SHA']
          assert hashlib.sha256((p/'Bible-alpha.flatpak').read_bytes()).hexdigest()==x['sha256']
          PY
          flatpak install --user --noninteractive --reinstall "$RUNNER_TEMP/candidate-bundle/Bible-alpha.flatpak"
      - name: Verify candidate or diagnose development source with the same native runtime
        env:
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: |
          set -euo pipefail
          if [ -n "$CANDIDATE_RUN" ]; then
            python_path="/app/lib/bible-python:$PWD"
            source_flags=(--require-packaged)
            flags=(--require-packaged)
            mkdir -p "$RUNNER_TEMP/rendering-after"
            cp "$RUNNER_TEMP/candidate-bundle/build-info.json" "$RUNNER_TEMP/rendering-after/"
          else
            python_path="$PWD:/app/lib/bible-python"
            source_flags=(--runtime-probe)
            flags=()
          fi
          timeout 240s dbus-run-session -- xvfb-run -a -s '-screen 0 1200x850x24' flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="$python_path" --env=GSK_RENDERER=gl --command=python3 io.github.icfmp.Bible//master -m tools.check_source_rendering "$RUNNER_TEMP/research-profile" "$RUNNER_TEMP/rendering-after" "${source_flags[@]}"
          for tool in check_reader_chrome check_library_categories check_commentary_context check_followup_surfaces check_quotation_search; do
            extra=()
            if [ "$tool" = check_followup_surfaces ]; then extra=(--maps); fi
            timeout 240s dbus-run-session -- xvfb-run -a -s '-screen 0 1200x850x24' flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="$python_path" --env=GSK_RENDERER=gl --env=LANGUAGE=fr_FR --command=python3 io.github.icfmp.Bible//master -m "tools.$tool" "$RUNNER_TEMP/research-profile" "$RUNNER_TEMP/rendering-after/$tool" "${flags[@]}" "${extra[@]}"
          done
          # A separate marked acquisition profile proves a real candidate download;
          # the comparison profile retains its already installed datasets unchanged.
          mkdir "$RUNNER_TEMP/library-acquisition-profile"
          touch "$RUNNER_TEMP/library-acquisition-profile/.source-rendering-research"
          timeout 240s dbus-run-session -- xvfb-run -a -s '-screen 0 1200x850x24' flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="$python_path" --env=GSK_RENDERER=gl --env=LANGUAGE=fr_FR --command=python3 io.github.icfmp.Bible//master -m tools.check_library_categories "$RUNNER_TEMP/library-acquisition-profile" "$RUNNER_TEMP/rendering-after/actual-library-acquisition" "${flags[@]}" --install
          timeout 240s dbus-run-session -- xvfb-run -a -s '-screen 0 1200x850x24' flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="$python_path" --env=GSK_RENDERER=gl --env=LANGUAGE=en --command=python3 io.github.icfmp.Bible//master -m tools.check_followup_surfaces "$RUNNER_TEMP/research-profile" "$RUNNER_TEMP/rendering-after/english-surfaces" "${flags[@]}" --maps
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-rendering-runtime-probe
          path: |
            ${{ runner.temp }}/rendering-before/
            ${{ runner.temp }}/rendering-after/
          if-no-files-found: warn
