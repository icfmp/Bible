name: Check workflow policy
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tests/test_validation_workflows.py'
      - 'AGENTS.md'
      - 'docs/VALIDATION.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tests/test_validation_workflows.py'
      - 'AGENTS.md'
      - 'docs/VALIDATION.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workflow-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install YAML validation dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Validate workflow syntax and delivery gates
        run: python -m unittest tests.test_validation_workflows -v
