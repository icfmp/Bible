name: Measure installed reading feedback
on:
  push:
    branches: [perf/alpha-native-trace]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Install isolated validation tools
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update -qq
          sudo apt-get install -y flatpak xvfb xauth dbus-x11 xcompmgr linux-tools-generic ffmpeg
          echo "FLATPAK_USER_DIR=$RUNNER_TEMP/performance-flatpak" >> "$GITHUB_ENV"
          echo "PERF_PROFILE=$RUNNER_TEMP/performance-profile" >> "$GITHUB_ENV"
      - name: Wait for successful exact-head GNOME checks and obtain candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            run=$(gh api 'repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=100' --jq '.workflow_runs[] | select(.name=="Vérifier le socle GNOME") | [.id,.status,(.conclusion // "pending")] | @tsv' | head -1)
            if [ -n "$run" ]; then
              read -r build_run status conclusion <<< "$run"
              if [ "$status" = completed ]; then test "$conclusion" = success; break; fi
            fi
            sleep 20
          done
          test "${conclusion:-pending}" = success
          echo "Verified candidate CI: $build_run"
          gh run download "$build_run" --repo '${{ github.repository }}' --name Bible-alpha-linux-x86_64 --dir "$RUNNER_TEMP/candidate-bundle"
      - name: Download current published application's verified CI bundle
        uses: actions/download-artifact@v4
        with:
          name: Bible-alpha-linux-x86_64
          run-id: 40454566453
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/current-bundle
      - name: Verify exact published build inputs and install an isolated CI ref
        run: |
          mkdir reports
          python3 - "$RUNNER_TEMP" <<'PYTHON'
          import hashlib,json,pathlib,sys
          import os
          root=pathlib.Path(sys.argv[1]);expected={
            'current-bundle':('d39a99eb44be1c3257a9ba75f60f7f324282b1b1','b17bc4e1f85c7f1b679f4dd9dd5994ec9b6e539521886249890f928567b46fff'),
            'candidate-bundle':(os.environ['GITHUB_SHA'],None)}
          receipt={}
          for name,(source,digest) in expected.items():
              folder=root/name;info=json.loads((folder/'build-info.json').read_text())
              assert info['commit']==source and (digest is None or info['sha256']==digest)
              assert hashlib.sha256((folder/'Bible-alpha.flatpak').read_bytes()).hexdigest()==info['sha256']
              receipt[name]=info
          pathlib.Path('reports/ci-input-verification.json').write_text(json.dumps(dict(inputs=receipt,limitation='Baseline is the exact verified CI bundle imported into signed alpha; candidate is a tested feature-branch CI master ref. Candidate is not yet published on the signed channel. Application imports must be packaged.'),indent=2))
          PYTHON
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive "$RUNNER_TEMP/current-bundle/Bible-alpha.flatpak"
          flatpak info --user io.github.icfmp.Bible//master > reports/installation.txt
      - name: Obtain frozen previously validated optional topic data
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/openbible-topics.sqlite3.gz" https://raw.githubusercontent.com/icfmp/Bible/1c82609a0947822908fdfab7d3b42f7b79146265/docs/evidence/alpha-performance/fixtures/openbible-topics.sqlite3.gz
          echo "f8d8ebe33c339f3f910c930fef1af5713ee9a154bdbb363d7abf1844452a8c2e  $RUNNER_TEMP/openbible-topics.sqlite3.gz" | sha256sum --check
      - name: Prepare real resources and persistent annotations once
        run: |
          flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --command=python3 io.github.icfmp.Bible//master - "$PERF_PROFILE" "$RUNNER_TEMP/openbible-topics.sqlite3.gz" <<'PY'
          import json,sys,hashlib
          from pathlib import Path
          from dataclasses import asdict
          from bible.library import Library,catalogue
          from bible.notes import NoteStore
          from bible.preferences import Preferences
          root=Path(sys.argv[1]);library=Library(root/'translations');resources=catalogue()
          for name in ['FreSegond1910','FreBDM1707','KJV','Wesley']:
              if name not in library.installed():library.install(next(r for r in resources if r.name==name))
          notes=NoteStore(root/'notes.sqlite3')
          if not notes.all():notes.save('Persistent performance-validation note',['preserve'],versification='KJV',start='John.1.1',end='John.1.1',origin_translation='KJV',origin_language='en')
          from bible.step_data import StepData
          from bible.place_data import PlaceData
          StepData(root/'study-data').install()
          PlaceData(root/'study-data').install()
          from bible.reference_data import ReferenceData
          from bible.topic_data import TopicData
          ReferenceData(root/'study-data').install()
          # Reuse an attributed, validated installed index. Today's weekly upstream
          # archive differs from the source pinned by the published application.
          import gzip
          topic_bytes=gzip.decompress(Path(sys.argv[2]).read_bytes())
          assert len(topic_bytes)==4964352 and hashlib.sha256(topic_bytes).hexdigest()=='90db0daa43b1981a82d66481dc07211e395eba5ab56c15a8ee57cdb06d1ec209'
          topics=TopicData(root/'study-data')
          if topics.path.exists():assert topics.path.read_bytes()==topic_bytes
          else:topics.path.write_bytes(topic_bytes)
          assert topics.metadata()['archive_sha256']=='47bc1cb1defe5b8f0f65ca9966cd99ff151b7f22cab18ef9c99eda6a244df7cc'
          preferences=Preferences(root/'reading-preferences.json');preferences.value.size=24;preferences.save()
          receipt=dict(study_data={str(p.relative_to(root/'study-data')):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'study-data').rglob('*') if p.is_file()},notes=[asdict(n) for n in notes.all()],preferences_sha256=hashlib.sha256(preferences.path.read_bytes()).hexdigest(),modules={str(p.relative_to(library.root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in library.root.rglob('*') if p.is_file()})
          (root/'preservation-before.json').write_text(json.dumps(receipt,indent=2))
          PY
      - name: Compare actual wheel and native scrollbar input at scale two
        run: |
          set -euo pipefail
          run_case() {
            local label="$1"; shift
            local renderer=()
            if [ -n "${PERF_RENDERER:-}" ]; then renderer=(--env=GSK_RENDERER="$PERF_RENDERER"); fi
            flatpak info --user --show-commit io.github.icfmp.Bible//master > "reports/$label.commit"
            timeout 240s dbus-run-session -- xvfb-run -a -s '-screen 0 2880x2200x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$PWD/reports" --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GDK_SCALE=2 --env=GTK_A11Y=none "${renderer[@]}" --command=python3 io.github.icfmp.Bible//master -m tools.profile_alpha_performance "$PERF_PROFILE" "$PWD/reports/$label.json" --require-packaged --resource FreSegond1910 --reference Ps.119.1 "$@" > "reports/$label.log" 2>&1
          }
          for version in current candidate; do
            if [ "$version" = candidate ]; then flatpak install --user --noninteractive --reinstall "$RUNNER_TEMP/$version-bundle/Bible-alpha.flatpak"; fi
            run_case "$version-scrollbar" --input-kind scrollbar --cycles 8
            run_case "$version-wheel" --cycles 2
            run_case "$version-combined-scrollbar" --mode combined --input-kind scrollbar --cycles 8
            run_case "$version-combined-wheel" --mode combined --cycles 4
            PERF_RENDERER=gl run_case "$version-combined-gl" --mode combined --input-kind scrollbar --cycles 2
            run_case "$version-combined-cache-ablation" --mode combined --cache-resource-metadata --input-kind scrollbar --cycles 2
            run_case "$version-comparison" --mode comparison --cycles 2
            run_case "$version-study" --mode study --cycles 2
            run_case "$version-toolbar-native" --toolbar --cycles 2
            run_case "$version-toolbar-disabled" --toolbar --backdrop disabled --cycles 2
            run_case "$version-python" --instrument --mode combined --input-kind scrollbar --cycles 2
            perf_bin=$(find -L /usr/lib/linux-tools -type f -name perf | head -1)
            test -n "$perf_bin"
            run_case "$version-native-cpu" --input-kind scrollbar --mode combined --cycles 2 &
            task_pid=$!
            sudo python3 tools/sample_alpha_cpu.py "$perf_bin" "$PWD/reports/$version-native-cpu.json" "$RUNNER_TEMP/perf-symbols-$version"
            wait "$task_pid"
          done
      - name: Prepare the already-reviewed Semeur resource for isolated visual checks
        run: |
          python3 -m tools.research.fetch_yves_probe "$RUNNER_TEMP/feedback-input"
          mkdir -p "$RUNNER_TEMP/feedback-visuals"
          cp -a "$PERF_PROFILE" "$RUNNER_TEMP/feedback-visuals/shared-proof-profile"
          touch "$RUNNER_TEMP/feedback-visuals/shared-proof-profile/.youversion-proof-profile"
          flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --command=python3 io.github.icfmp.Bible//master -m tools.research.check_youversion_install "$RUNNER_TEMP/feedback-input/source.zip" --metadata "$RUNNER_TEMP/feedback-input/metadata.json" --version 21 --output "$RUNNER_TEMP/feedback-visuals/seed" --shared-profile --require-packaged
          cp "$RUNNER_TEMP/feedback-visuals/seed/verification.json" reports/semeur-visual-source.json
      - name: Record installed native before and after surfaces and motion
        run: |
          set -euo pipefail
          for version in current candidate; do
            flatpak install --user --noninteractive --reinstall "$RUNNER_TEMP/$version-bundle/Bible-alpha.flatpak"
            cp -a "$RUNNER_TEMP/feedback-visuals/shared-proof-profile" "$RUNNER_TEMP/feedback-visuals/$version"
            baseline=()
            if [ "$version" = current ]; then baseline=(--baseline); fi
            for section in comparison markers notes preferences navigation immersion; do
              timeout 240s dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --filesystem="$PWD/reports" --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE=fr --command=python3 io.github.icfmp.Bible//master -m tools.check_reading_feedback "$RUNNER_TEMP/feedback-visuals/$version" "$PWD/reports/visual-$version-$section" --section "$section" --require-packaged "${baseline[@]}" > "reports/visual-$version-$section.log" 2>&1
            done
          done
          timeout 180s dbus-run-session -- xvfb-run -a flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --command=python3 io.github.icfmp.Bible//master -m tools.check_alpha_ui > reports/candidate-native-navigation.log 2>&1
      - name: Verify retained profile data and translations
        if: always()
        run: |
          flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD" --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --command=python3 io.github.icfmp.Bible//master - "$PERF_PROFILE" "$PWD/reports/preservation.json" <<'PY'
          import json,sys,hashlib
          from pathlib import Path
          from dataclasses import asdict
          from bible.notes import NoteStore
          root=Path(sys.argv[1]);before=json.loads((root/'preservation-before.json').read_text());notes=NoteStore(root/'notes.sqlite3')
          after=dict(study_data={str(p.relative_to(root/'study-data')):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'study-data').rglob('*') if p.is_file()},notes=[asdict(n) for n in notes.all()],preferences_sha256=hashlib.sha256((root/'reading-preferences.json').read_bytes()).hexdigest(),modules={str(p.relative_to(root/'translations')):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'translations').rglob('*') if p.is_file()})
          after=json.loads(json.dumps(after))
          differences=[key for key in before if before[key]!=after[key]]
          Path(sys.argv[2]).with_name('preservation-comparison.json').write_text(json.dumps(dict(before=before,after=after,differences=differences),indent=2))
          assert not differences, 'Changed persisted components: '+str(differences)
          Path(sys.argv[2]).write_text(json.dumps(dict(preserved=True,notes=len(after['notes']),module_files=len(after['modules']),profile_reused=True),indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha-candidate-performance
          path: reports/
          if-no-files-found: error
