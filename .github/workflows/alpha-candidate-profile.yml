name: Verify installed alignment regression across real resources
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Exact candidate main-check workflow run
        required: true
      candidate_head:
        description: Exact candidate application source
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: alignment215-installed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      CANDIDATE_HEAD: ${{ inputs.candidate_head }}
    steps:
      - uses: actions/checkout@v6
      - name: Install isolated Flatpak and native input tools
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update -qq
          sudo apt-get install -y flatpak xvfb xauth dbus-x11 xcompmgr ostree
          echo "FLATPAK_USER_DIR=$RUNNER_TEMP/alignment-flatpak" >> "$GITHUB_ENV"
          echo "ALIGNMENT_PROFILE=$RUNNER_TEMP/alignment-profile" >> "$GITHUB_ENV"
          mkdir reports
      - name: Install and verify unchanged signed alpha25
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive https://icfmp.github.io/Bible/alpha/Bible.flatpakref
          python3 - <<'PY'
          import json,subprocess,urllib.request
          from pathlib import Path
          x=json.load(urllib.request.urlopen('https://icfmp.github.io/Bible/alpha/provenance.json'))
          assert x['source_commit']=='c7009d0162c0b2b85cc8f99e5b024e17e764bd3e'
          assert x['flatpak_commit']=='0841dca6e6d3cd1d191314e2ffde228151f298c3186773ab4972d3b185cbaba2'
          assert x['signing_fingerprint']=='47A17230403EA4953745E6E020EB9FFCCECAFD8F'
          assert subprocess.check_output(['flatpak','info','--user','--show-commit','io.github.icfmp.Bible//alpha'],text=True).strip()==x['flatpak_commit']
          Path('reports/baseline-provenance.json').write_text(json.dumps(x,indent=2))
          PY
          ostree show --repo="$FLATPAK_USER_DIR/repo" --gpg-verify-remote=bible-alpha 0841dca6e6d3cd1d191314e2ffde228151f298c3186773ab4972d3b185cbaba2 > reports/baseline-signature.txt
      - name: Reproduce all reported failures and working MHC control before upgrade
        run: |
          timeout 900s dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --filesystem="$PWD/reports" --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE=fr --command=python3 io.github.icfmp.Bible//alpha -m tools.check_alignment_regression "$ALIGNMENT_PROFILE" "$PWD/reports/baseline-fr" --prepare --baseline --require-packaged > reports/baseline-fr.log 2>&1
      - name: Wait for the exact candidate to pass ordinary CI
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/icfmp/Bible/'+path],text=True))
          for attempt in range(120):
              run=api('actions/runs/'+os.environ['CANDIDATE_RUN'])
              assert run['head_sha']==os.environ['CANDIDATE_HEAD'] and run['path']=='.github/workflows/prerequisites.yml'
              if run['status']=='completed':
                  assert run['conclusion']=='success',run['conclusion'];break
              time.sleep(20)
          else:raise RuntimeError('Exact candidate CI did not finish')
          PY
          gh run download "$CANDIDATE_RUN" --repo '${{ github.repository }}' --name Bible-alpha-linux-x86_64 --dir "$RUNNER_TEMP/candidate-bundle"
      - name: Verify and install the exact candidate without replacing the profile
        run: |
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'candidate-bundle';x=json.loads((p/'build-info.json').read_text())
          assert x['commit']==os.environ['CANDIDATE_HEAD']
          assert hashlib.sha256((p/'Bible-alpha.flatpak').read_bytes()).hexdigest()==x['sha256']
          Path('reports/candidate-build-info.json').write_text(json.dumps(x,indent=2))
          PY
          flatpak install --user --noninteractive "$RUNNER_TEMP/candidate-bundle/Bible-alpha.flatpak"
      - name: Run the complete French and English nine-Bible native matrix
        run: |
          for language in fr en; do
            timeout 900s dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --filesystem="$PWD/reports" --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE="$language" --command=python3 io.github.icfmp.Bible//master -m tools.check_alignment_regression "$ALIGNMENT_PROFILE" "$PWD/reports/candidate-$language" --require-packaged > "reports/candidate-$language.log" 2>&1
          done
      - name: Restart offline and verify retained source-qualified parallel session
        run: |
          timeout 600s dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$PWD/reports" --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE=fr --command=python3 io.github.icfmp.Bible//master -m tools.check_alignment_regression "$ALIGNMENT_PROFILE" "$PWD/reports/candidate-offline" --offline --quick --require-packaged > reports/candidate-offline.log 2>&1
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('baseline-fr','candidate-fr','candidate-en','candidate-offline'):
              d=json.loads(Path('reports',name,'alignment.json').read_text())
              assert d['complete'] and d['preserved'] and d['app_import'].startswith('/app/') and d['renderer']=='GLRenderer'
              if name!='baseline-fr':assert len(d['resolver'])==294 and d['native_selector_changes']==4
              if name=='candidate-offline':assert d['offline'] and d['restored_session_verified']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-alignment215-evidence
          path: reports
