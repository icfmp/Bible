name: Check Python consistency
on:
  pull_request:
    branches: [main]
    paths: ['bible/**/*.py', 'tools/**/*.py', 'tests/**/*.py', 'pyproject.toml', 'requirements-dev.txt', '.github/workflows/python-quality.yml']
  push:
    branches: [main]
    paths: ['bible/**/*.py', 'tools/**/*.py', 'tests/**/*.py', 'pyproject.toml', 'requirements-dev.txt', '.github/workflows/python-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: python-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned development tooling
        run: python -m pip install -r requirements-dev.txt
      - name: Check formatting, lint and typed contracts
        run: |
          ruff format --check
          ruff check
          mypy
          mypy --platform win32
