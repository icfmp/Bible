name: Verify native animated Bible and commentary gestures
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Exact successful candidate workflow
        required: true
      candidate_head:
        description: Exact application source
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: alignment215-study-${{ github.ref }}
  cancel-in-progress: true
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      CANDIDATE_HEAD: ${{ inputs.candidate_head }}
    steps:
      - uses: actions/checkout@v6
      - name: Install native Flatpak verification tools
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update -qq
          sudo apt-get install -y flatpak xvfb xauth dbus-x11 xcompmgr
          echo "FLATPAK_USER_DIR=$RUNNER_TEMP/study-flatpak" >> "$GITHUB_ENV"
          echo "STUDY_PROFILE=$RUNNER_TEMP/study-profile" >> "$GITHUB_ENV"
          mkdir reports
      - name: Wait for and verify exact successful candidate build
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time
          for attempt in range(120):
              run=json.loads(subprocess.check_output(['gh','api','repos/icfmp/Bible/actions/runs/'+os.environ['CANDIDATE_RUN']],text=True))
              assert run['head_sha']==os.environ['CANDIDATE_HEAD'] and run['path']=='.github/workflows/prerequisites.yml'
              if run['status']=='completed':
                  assert run['conclusion']=='success';break
              time.sleep(20)
          else:raise RuntimeError('Exact candidate CI did not complete')
          PY
          gh run download "$CANDIDATE_RUN" --repo '${{ github.repository }}' --name Bible-alpha-linux-x86_64 --dir "$RUNNER_TEMP/candidate"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'candidate';d=json.loads((p/'build-info.json').read_text())
          assert d['commit']==os.environ['CANDIDATE_HEAD'] and hashlib.sha256((p/'Bible-alpha.flatpak').read_bytes()).hexdigest()==d['sha256']
          Path('reports/build-info.json').write_text(json.dumps(d,indent=2))
          PY
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive "$RUNNER_TEMP/candidate/Bible-alpha.flatpak"
      - name: Install real reported Bibles and seed retained synthetic annotations
        run: |
          flatpak run --user --cwd=/tmp --filesystem="$RUNNER_TEMP" --env=PYTHONPATH=/app/lib/bible-python --command=python3 io.github.icfmp.Bible//master - "$STUDY_PROFILE" <<'PY'
          import json,hashlib,sys
          from dataclasses import asdict
          from pathlib import Path
          from bible.library import Library,catalogue
          from bible.youversion_install import fetch_resource,acknowledgement
          from bible.notes import NoteStore
          from bible.highlights import HighlightStore
          from bible.preferences import Preferences
          root=Path(sys.argv[1]);root.mkdir();(root/'.alignment-test-profile').write_text('Disposable Study verification\n')
          lib=Library(root/'translations');resources=catalogue()
          for name in ('FreSegond1910','KJV','MHC'):lib.install(next(r for r in resources if r.id==name))
          for n in (133,152,2367):
              r=fetch_resource(n);lib.install(r,permission=acknowledgement(r))
          notes=NoteStore(root/'notes.sqlite3');notes.save('Synthetic retained Study gesture note',('retained',),versification='KJV',start='John.3.16',end='John.3.16',origin_translation='KJV',origin_language='en')
          highlights=HighlightStore(root/'highlights.json');highlights.set('KJV',['John.3.16'],'yellow','KJV')
          prefs=Preferences(root/'reading-preferences.json');prefs.save()
          d=dict(notes=[asdict(n) for n in notes.all()],preferences=hashlib.sha256(prefs.path.read_bytes()).hexdigest(),highlights=hashlib.sha256(highlights.path.read_bytes()).hexdigest(),modules={str(f.relative_to(lib.root)):hashlib.sha256(f.read_bytes()).hexdigest() for f in lib.root.rglob('*') if f.is_file()})
          (root/'before.json').write_text(json.dumps(d));notes.close()
          PY
      - name: Run repeated real wheel gestures in both directions and languages
        run: |
          for language in fr en; do
            offline=(); if [ "$language" = en ]; then offline=(--unshare=network); fi
            timeout 600s dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user "${offline[@]}" --cwd=/tmp --filesystem="$PWD":ro --filesystem="$PWD/reports" --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE="$language" --command=python3 io.github.icfmp.Bible//master -m tools.check_alignment_commentary_gestures "$STUDY_PROFILE" "$PWD/reports/study-$language" --require-packaged > "reports/study-$language.log" 2>&1
          done
      - name: Verify data, preferences and modules are preserved
        run: |
          flatpak run --user --cwd=/tmp --filesystem="$RUNNER_TEMP" --filesystem="$PWD/reports" --env=PYTHONPATH=/app/lib/bible-python --command=python3 io.github.icfmp.Bible//master - "$STUDY_PROFILE" "$PWD/reports" <<'PY'
          import json,sys,hashlib
          from pathlib import Path
          from dataclasses import asdict
          from bible.notes import NoteStore
          root,out=map(Path,sys.argv[1:]);before=json.loads((root/'before.json').read_text());notes=NoteStore(root/'notes.sqlite3')
          assert json.loads(json.dumps([asdict(n) for n in notes.all()]))==before['notes']
          for name in ('preferences','highlights'):
              path=root/('reading-preferences.json' if name=='preferences' else 'highlights.json')
              assert hashlib.sha256(path.read_bytes()).hexdigest()==before[name]
          modules={str(f.relative_to(root/'translations')):hashlib.sha256(f.read_bytes()).hexdigest() for f in (root/'translations').rglob('*') if f.is_file()}
          assert modules==before['modules'];notes.close()
          for language in ('fr','en'):
              d=json.loads((out/('study-'+language)/'commentary-gestures.json').read_text());assert d['animations_enabled'] and d['complete'] and len(d['checks'])==30 and len(d['handoffs'])==9 and d['renderer']=='GLRenderer'
              assert all('viewport' in c for c in d['checks'] if c['driver']=='bible')
          assert json.loads((out/'study-en/commentary-gestures.json').read_text())['network_isolated']
          (out/'preservation.json').write_text(json.dumps(dict(preserved=True,module_files=len(modules),notes=1)))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-alignment215-animations-evidence
          path: reports
