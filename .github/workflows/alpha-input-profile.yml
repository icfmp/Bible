name: Probe installed word-study and selection regressions
on:
  workflow_dispatch:
    inputs:
      publish_study_data:
        description: Publish checked study snapshots from the reviewed source, without changing the application
        type: boolean
        default: false
      library_search:
        description: Validate the installed Library, dedicated search and comparison selectors
        type: boolean
        default: false
      library_baseline:
        description: Capture the previous Library, combined passage/search and pane selectors
        type: boolean
        default: false
      study_updates:
        description: Validate actual installed study downloads and an offline restart on the retained profile
        type: boolean
        default: false
      language:
        description: Application interface language
        type: choice
        options: [fr, en]
        default: fr
      selection_only:
        description: Probe repeated selection without word-study or programmatic toolbar dismissal
        type: boolean
        default: false
      baseline_captures:
        description: Capture the previous unmodified immersion without exercising the known crash
        type: boolean
        default: false
      candidate_run:
        description: Successful ordinary candidate CI run (empty for previous alpha baseline)
        required: false
        default: ''
      candidate_source:
        description: Exact candidate source commit when candidate_run is set
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  study-resources:
    if: inputs.publish_study_data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: bible-study-resource-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_source }}
      - name: Validate the exact reviewed publisher and its data
        env:
          SOURCE: ${{ inputs.candidate_source }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          source=os.environ['SOURCE'];assert re.fullmatch('[0-9a-f]{40}',source)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          PY
          python3 -m unittest tests.test_study_catalogue tests.test_topic_data tests.test_reference_data.ReferenceDataTests
      - name: Publish complete checked archives before advancing the catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.study_resource_updates "$RUNNER_TEMP/study-resource-update" --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-study-resource-publication
          path: |
            ${{ runner.temp }}/study-resource-update/catalogue.json
            ${{ runner.temp }}/study-resource-update/provenance.json
  picker:
    if: ${{ !inputs.publish_study_data }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install exact ordinary Flatpak build in isolated directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak xvfb xauth dbus-x11 xcompmgr ffmpeg
          echo "FLATPAK_USER_DIR=$RUNNER_TEMP/picker-flatpak" >> "$GITHUB_ENV"
          gh run download ${{ inputs.candidate_run || '41779503655' }} --name Bible-alpha-linux-x86_64 --dir "$RUNNER_TEMP/bundle"
          python3 - "$RUNNER_TEMP/bundle" <<'PY'
          import json,hashlib,sys
          from pathlib import Path
          p=Path(sys.argv[1]);b=json.loads((p/'build-info.json').read_text())
          expected='${{ inputs.candidate_source }}' or '39449e0743c8e8b6fb03fbfc30a7d259046502f3'
          assert b['commit']==expected
          assert hashlib.sha256((p/'Bible-alpha.flatpak').read_bytes()).hexdigest()==b['sha256']
          PY
          FLATPAK_USER_DIR="$RUNNER_TEMP/picker-flatpak" flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          FLATPAK_USER_DIR="$RUNNER_TEMP/picker-flatpak" flatpak install --user --noninteractive "$RUNNER_TEMP/bundle/Bible-alpha.flatpak"
      - name: Real BDS Mark 11 word choices and repeated native selection
        run: |
          mkdir reports
          module=tools.check_ready_word_selection
          if [ '${{ inputs.library_search }}' = true ]; then module=tools.check_ready_library_search; fi
          if [ '${{ inputs.study_updates }}' = true ]; then module=tools.check_ready_study_updates; fi
          mode=()
          if [ '${{ inputs.library_baseline }}' = true ]; then mode+=(--baseline); fi
          if [ '${{ inputs.baseline_captures }}' = true ]; then mode+=(--baseline-captures); fi
          if [ '${{ inputs.selection_only }}' = true ]; then mode+=(--selection-only); fi
          timeout 1000s dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --filesystem="$PWD/reports" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE='${{ inputs.language || 'fr' }}' --command=python3 io.github.icfmp.Bible//master -X faulthandler -m "$module" "$RUNNER_TEMP/profile" "$PWD/reports" --prepare --require-packaged "${mode[@]}" > "$RUNNER_TEMP/picker.log" 2>&1
          if [ '${{ inputs.study_updates }}' = true ]; then
            timeout 200s dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --filesystem="$PWD/reports" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE='${{ inputs.language || 'fr' }}' --command=python3 io.github.icfmp.Bible//master -X faulthandler -m tools.check_ready_study_updates "$RUNNER_TEMP/profile" "$PWD/reports" --offline --require-packaged >> "$RUNNER_TEMP/picker.log" 2>&1
          fi
      - name: Bounded failure diagnosis
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/picker.log" ]; then tail -n 130 "$RUNNER_TEMP/picker.log"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-word-selection-probe
          path: |
            reports/*.png
            reports/*.json
            reports/*.mp4
          if-no-files-found: error
