name: Inspect published alpha26 icons and GNOME Software baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install native software center and isolated alpha26
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt; fi
          sudo apt-get update -qq
          sudo apt-get install -y flatpak gnome-software gnome-software-plugin-flatpak appstream xvfb xauth xcompmgr dbus-x11 xdotool python3-gi
          mkdir reports
          echo "FLATPAK_USER_DIR=$RUNNER_TEMP/baseline-flatpak" >> "$GITHUB_ENV"
          export FLATPAK_USER_DIR="$RUNNER_TEMP/baseline-flatpak"
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive https://icfmp.github.io/Bible/alpha/Bible.flatpakref
          flatpak info --user io.github.icfmp.Bible//alpha > reports/flatpak-info.txt
      - name: Inspect actual packaged icons and distribution metadata
        run: |
          dbus-run-session -- xvfb-run -a flatpak run --user --filesystem="$PWD/reports" --command=python3 io.github.icfmp.Bible//alpha - "$PWD/reports" <<'PY'
          import json,sys
          from pathlib import Path
          import gi
          gi.require_version('Gtk','4.0')
          from gi.repository import Gtk,Gdk
          Gtk.init();theme=Gtk.IconTheme.get_for_display(Gdk.Display.get_default());theme.add_search_path('/app/lib/bible-python/bible/icons')
          names=('dictionary-symbolic','notebook-symbolic','mark-location-symbolic','filter-symbolic','talking-symbolic')
          data=dict(gtk=[Gtk.get_major_version(),Gtk.get_minor_version(),Gtk.get_micro_version()],icons={n:theme.has_icon(n) for n in names},metainfo=[str(p) for folder in ('metainfo','appdata') for p in Path('/app/share',folder).glob('*')],desktop=Path('/app/share/applications/io.github.icfmp.Bible.desktop').read_text(),icon_files=[str(p) for p in Path('/app/share/icons').rglob('*Bible*')])
          Path(sys.argv[1],'installed-metadata.json').write_text(json.dumps(data,indent=2));print(json.dumps(data,indent=2))
          PY
          flatpak update --user --appstream --noninteractive bible-alpha > reports/remote-appstream.txt 2>&1 || true
          gnome-software --version > reports/software-version.txt
      - name: Open actual installed application details in GNOME Software
        run: |
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' /usr/bin/python3 -m tools.composited_x11 bash -c '
            export XDG_DATA_DIRS="$FLATPAK_USER_DIR/exports/share:/usr/local/share:/usr/share"
            gnome-software --details=io.github.icfmp.Bible > reports/gnome-software.log 2>&1 &
            software_pid=$!
            python3 - <<'"'"'PY'"'"'
          import time
          from pathlib import Path
          from tools.check_alpha_ui import X11Input
          from tools.check_client_feedback import Screen
          n=X11Input();time.sleep(15);Screen(n).grab(Path("reports/gnome-software-before.png"));n.close()
          PY
            kill "$software_pid" || true
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ready-204-232-packaged-baseline
          path: reports
