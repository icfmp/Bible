name: Probe installed word-study and selection regressions
on:
  workflow_dispatch:
    inputs:
      baseline_captures:
        description: Capture the previous unmodified immersion without exercising the known crash
        type: boolean
        default: false
      candidate_run:
        description: Successful ordinary candidate CI run (empty for previous alpha baseline)
        required: false
        default: ''
      candidate_source:
        description: Exact candidate source commit when candidate_run is set
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  picker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install exact ordinary Flatpak build in isolated directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak xvfb xauth dbus-x11 xcompmgr ffmpeg
          echo "FLATPAK_USER_DIR=$RUNNER_TEMP/picker-flatpak" >> "$GITHUB_ENV"
          gh run download ${{ inputs.candidate_run || '41779503655' }} --name Bible-alpha-linux-x86_64 --dir "$RUNNER_TEMP/bundle"
          python3 - "$RUNNER_TEMP/bundle" <<'PY'
          import json,hashlib,sys
          from pathlib import Path
          p=Path(sys.argv[1]);b=json.loads((p/'build-info.json').read_text())
          expected='${{ inputs.candidate_source }}' or '39449e0743c8e8b6fb03fbfc30a7d259046502f3'
          assert b['commit']==expected
          assert hashlib.sha256((p/'Bible-alpha.flatpak').read_bytes()).hexdigest()==b['sha256']
          PY
          FLATPAK_USER_DIR="$RUNNER_TEMP/picker-flatpak" flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          FLATPAK_USER_DIR="$RUNNER_TEMP/picker-flatpak" flatpak install --user --noninteractive "$RUNNER_TEMP/bundle/Bible-alpha.flatpak"
      - name: Real BDS Mark 11 word choices and repeated native selection
        run: |
          mkdir reports
          module=tools.check_ready_word_selection
          mode=()
          if [ '${{ inputs.baseline_captures }}' = true ]; then mode=(--baseline-captures); fi
          timeout 1000s dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --filesystem="$PWD/reports" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE=fr --command=python3 io.github.icfmp.Bible//master -X faulthandler -m "$module" "$RUNNER_TEMP/profile" "$PWD/reports" --prepare --require-packaged "${mode[@]}" > "$RUNNER_TEMP/picker.log" 2>&1
      - name: Bounded failure diagnosis
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/picker.log" ]; then tail -n 130 "$RUNNER_TEMP/picker.log"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-word-selection-probe
          path: |
            reports/*.png
            reports/*.json
            reports/*.mp4
          if-no-files-found: error
