name: Probe installed word-study and selection regressions
on:
  workflow_dispatch:
    inputs:
      ready_reading_notes:
        description: Compare alpha24 and the exact Ready reading/notes Flatpak, with native evidence
        type: boolean
        default: false
      study_followups:
        description: Verify real study previews, topics, original words and bidirectional comparison
        type: boolean
        default: false
      nfc_sections:
        description: Download real NBS and NFC in Library, validate source sections and restart offline
        type: boolean
        default: false
      alignment:
        description: Validate real Darby/NBS and shared comparison contexts, then restart offline
        type: boolean
        default: false
      publish_study_data:
        description: Publish checked study snapshots from the reviewed source, without changing the application
        type: boolean
        default: false
      library_search:
        description: Validate the installed Library, dedicated search and comparison selectors
        type: boolean
        default: false
      library_baseline:
        description: Capture the previous Library, combined passage/search and pane selectors
        type: boolean
        default: false
      study_updates:
        description: Validate actual installed study downloads and an offline restart on the retained profile
        type: boolean
        default: false
      language:
        description: Application interface language
        type: choice
        options: [fr, en]
        default: fr
      selection_only:
        description: Probe repeated selection without word-study or programmatic toolbar dismissal
        type: boolean
        default: false
      selection_matrix:
        description: Exercise real multiline replacements, directions, narrow/study/comparison and keyboard selection
        type: boolean
        default: false
      baseline_captures:
        description: Capture the previous unmodified immersion without exercising the known crash
        type: boolean
        default: false
      candidate_run:
        description: Successful ordinary candidate CI run (empty for previous alpha baseline)
        required: false
        default: ''
      candidate_source:
        description: Exact candidate source commit when candidate_run is set
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  study-resources:
    if: inputs.publish_study_data
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: bible-study-resource-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_source }}
      - name: Validate the exact reviewed publisher and its data
        env:
          SOURCE: ${{ inputs.candidate_source }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          source=os.environ['SOURCE'];assert re.fullmatch('[0-9a-f]{40}',source)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          PY
          python3 -m unittest tests.test_study_catalogue tests.test_topic_data tests.test_reference_data.ReferenceDataTests
      - name: Publish complete checked archives before advancing the catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.study_resource_updates "$RUNNER_TEMP/study-resource-update" --publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-study-resource-publication
          path: |
            ${{ runner.temp }}/study-resource-update/catalogue.json
            ${{ runner.temp }}/study-resource-update/provenance.json
  picker:
    if: ${{ !inputs.publish_study_data && !inputs.ready_reading_notes }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install exact ordinary Flatpak build in isolated directory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak xvfb xauth dbus-x11 xcompmgr ffmpeg
          echo "FLATPAK_USER_DIR=$RUNNER_TEMP/picker-flatpak" >> "$GITHUB_ENV"
          gh run download ${{ inputs.candidate_run || '41779503655' }} --name Bible-alpha-linux-x86_64 --dir "$RUNNER_TEMP/bundle"
          python3 - "$RUNNER_TEMP/bundle" <<'PY'
          import json,hashlib,sys
          from pathlib import Path
          p=Path(sys.argv[1]);b=json.loads((p/'build-info.json').read_text())
          expected='${{ inputs.candidate_source }}' or '39449e0743c8e8b6fb03fbfc30a7d259046502f3'
          assert b['commit']==expected
          assert hashlib.sha256((p/'Bible-alpha.flatpak').read_bytes()).hexdigest()==b['sha256']
          PY
          FLATPAK_USER_DIR="$RUNNER_TEMP/picker-flatpak" flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          FLATPAK_USER_DIR="$RUNNER_TEMP/picker-flatpak" flatpak install --user --noninteractive "$RUNNER_TEMP/bundle/Bible-alpha.flatpak"
      - name: Isolated pinned research-only DOM oracle
        if: inputs.nfc_sections && !inputs.library_baseline
        run: |
          python3 - "$RUNNER_TEMP/research-python" <<'PY'
          import hashlib,io,sys,urllib.request,zipfile
          from pathlib import Path
          url='https://files.pythonhosted.org/packages/ac/7d/8bf1fd8bae8247743968bb76d027a1ac5bd2c4b44495fba6a71b30d10706/lxml-6.1.3-cp313-cp313-manylinux_2_26_x86_64.manylinux_2_28_x86_64.whl'
          data=urllib.request.urlopen(url,timeout=45).read()
          assert hashlib.sha256(data).hexdigest()=='d85dfab42dd672f87a7f76e9de7172962aee69fa12044f0d6e1a23cbd53fb80e'
          out=Path(sys.argv[1]);out.mkdir()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for member in z.infolist():assert (out/member.filename).resolve().is_relative_to(out.resolve())
              z.extractall(out)
          PY
      - name: Neutral source sections and fragments in the actual installed candidate
        if: inputs.nfc_sections && !inputs.library_baseline
        run: |
          timeout 100s dbus-run-session -- xvfb-run -a flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD:$RUNNER_TEMP/research-python" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --command=python3 io.github.icfmp.Bible//master -X faulthandler -m unittest tests.test_source_sections tests.test_source_section_key tests.test_source_units tests.test_source_units_native -v > "$RUNNER_TEMP/source-units.log" 2>&1
          tail -n 6 "$RUNNER_TEMP/source-units.log"
      - name: Verify source conventions and word-study regressions in the installed candidate
        if: inputs.study_followups && !inputs.library_baseline
        run: |
          timeout 180s dbus-run-session -- xvfb-run -a flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --command=python3 io.github.icfmp.Bible//master -X faulthandler -m unittest tests.test_declared_reference_convention tests.test_step_data tests.test_word_study tests.test_study_references tests.test_comparison_sync -v > "$RUNNER_TEMP/followup-tests.log" 2>&1
          tail -n 6 "$RUNNER_TEMP/followup-tests.log"
      - name: Real BDS Mark 11 word choices and repeated native selection
        run: |
          mkdir reports
          module=tools.check_ready_word_selection
          if [ '${{ inputs.library_search }}' = true ]; then module=tools.check_ready_library_search; fi
          if [ '${{ inputs.study_updates }}' = true ]; then module=tools.check_ready_study_updates; fi
          duration=1000
          if [ '${{ inputs.alignment }}' = true ]; then module=tools.check_ready_alignment; duration=2000; fi
          if [ '${{ inputs.nfc_sections }}' = true ]; then module=tools.check_nfc_sections; duration=2000; fi
          if [ '${{ inputs.study_followups }}' = true ]; then module=tools.check_study_followups; duration=2000; fi
          mode=()
          if [ '${{ inputs.library_baseline }}' = true ]; then mode+=(--baseline); fi
          if [ '${{ inputs.baseline_captures }}' = true ]; then mode+=(--baseline-captures); fi
          if [ '${{ inputs.selection_only }}' = true ]; then mode+=(--selection-only); fi
          if [ '${{ inputs.selection_matrix }}' = true ]; then mode+=(--selection-matrix); fi
          timeout "${duration}s" dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --filesystem="$PWD/reports" --env=PYTHONPATH="/app/lib/bible-python:$PWD:$RUNNER_TEMP/research-python" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE='${{ inputs.language || 'fr' }}' --command=python3 io.github.icfmp.Bible//master -X faulthandler -m "$module" "$RUNNER_TEMP/profile" "$PWD/reports" --prepare --require-packaged "${mode[@]}" > "$RUNNER_TEMP/picker.log" 2>&1
          if [ '${{ inputs.study_updates }}' = true ]; then
            timeout 200s dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --filesystem="$PWD/reports" --env=PYTHONPATH="/app/lib/bible-python:$PWD:$RUNNER_TEMP/research-python" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE='${{ inputs.language || 'fr' }}' --command=python3 io.github.icfmp.Bible//master -X faulthandler -m tools.check_ready_study_updates "$RUNNER_TEMP/profile" "$PWD/reports" --offline --require-packaged >> "$RUNNER_TEMP/picker.log" 2>&1
          fi
          if [ '${{ inputs.alignment }}' = true ]; then
            timeout 200s dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --filesystem="$PWD/reports" --env=PYTHONPATH="/app/lib/bible-python:$PWD:$RUNNER_TEMP/research-python" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE='${{ inputs.language || 'fr' }}' --command=python3 io.github.icfmp.Bible//master -X faulthandler -m tools.check_ready_alignment "$RUNNER_TEMP/profile" "$PWD/reports" --offline --require-packaged >> "$RUNNER_TEMP/picker.log" 2>&1
          fi
          if [ '${{ inputs.nfc_sections }}' = true ] && [ '${{ inputs.library_baseline }}' != true ]; then
            timeout 200s dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --filesystem="$PWD/reports" --env=PYTHONPATH="/app/lib/bible-python:$PWD:$RUNNER_TEMP/research-python" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE='${{ inputs.language || 'fr' }}' --command=python3 io.github.icfmp.Bible//master -X faulthandler -m tools.check_nfc_sections "$RUNNER_TEMP/profile" "$PWD/reports" --offline --require-packaged >> "$RUNNER_TEMP/picker.log" 2>&1
          fi
          if [ '${{ inputs.study_followups }}' = true ] && [ '${{ inputs.library_baseline }}' != true ]; then
            timeout 400s dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --filesystem="$PWD/reports" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE='${{ inputs.language || 'fr' }}' --command=python3 io.github.icfmp.Bible//master -X faulthandler -m tools.check_study_followups "$RUNNER_TEMP/profile" "$PWD/reports" --offline --require-packaged >> "$RUNNER_TEMP/picker.log" 2>&1
          fi
      - name: Bounded failure diagnosis
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/picker.log" ]; then tail -n 130 "$RUNNER_TEMP/picker.log"; fi
          if [ -f "$RUNNER_TEMP/source-units.log" ]; then tail -n 80 "$RUNNER_TEMP/source-units.log"; fi
          if [ -f "$RUNNER_TEMP/followup-tests.log" ]; then tail -n 80 "$RUNNER_TEMP/followup-tests.log"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-word-selection-probe
          path: |
            reports/*.png
            reports/*.json
            reports/*.mp4
          if-no-files-found: error
  ready-reading-notes:
    if: inputs.ready_reading_notes
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_source }}
          path: candidate-checks
      - name: Install verified signed alpha24 and exact candidate bundle
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.candidate_source }}
          BUILD: ${{ inputs.candidate_run }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak xvfb xauth dbus-x11 xcompmgr ostree
          echo "FLATPAK_USER_DIR=$RUNNER_TEMP/ready-flatpak" >> "$GITHUB_ENV"
          echo "READY_PROFILE=$RUNNER_TEMP/ready-profile" >> "$GITHUB_ENV"
          gh run download "$BUILD" --name Bible-alpha-linux-x86_64 --dir "$RUNNER_TEMP/candidate-bundle"
          python3 - <<'PY'
          import os,json,hashlib,re,subprocess
          from pathlib import Path
          source=os.environ['SOURCE'];assert re.fullmatch('[0-9a-f]{40}',source)
          assert subprocess.check_output(['git','-C','candidate-checks','rev-parse','HEAD'],text=True).strip()==source
          p=Path(os.environ['RUNNER_TEMP'])/'candidate-bundle';x=json.loads((p/'build-info.json').read_text())
          assert x['commit']==source and hashlib.sha256((p/'Bible-alpha.flatpak').read_bytes()).hexdigest()==x['sha256']
          PY
          export FLATPAK_USER_DIR="$RUNNER_TEMP/ready-flatpak"
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive https://icfmp.github.io/Bible/alpha/Bible.flatpakref
          flatpak update --user --noninteractive --commit=b69b230c39958e81c574c8bf7e714789693027d5e96a9e2f1e4b6b857259f32e io.github.icfmp.Bible//alpha
          mkdir reports
          ostree show --repo="$FLATPAK_USER_DIR/repo" --gpg-verify-remote=bible-alpha b69b230c39958e81c574c8bf7e714789693027d5e96a9e2f1e4b6b857259f32e > reports/alpha24-signature.txt
          flatpak install --user --noninteractive "$RUNNER_TEMP/candidate-bundle/Bible-alpha.flatpak"
          cp "$RUNNER_TEMP/candidate-bundle/build-info.json" reports/candidate-build-info.json
          flatpak run --user --unshare=network --command=python3 io.github.icfmp.Bible//alpha -c "import hashlib;from pathlib import Path;assert hashlib.sha256(Path('/app/lib/bible-python/bible/ui.py').read_bytes()).hexdigest()=='8b020a66454e65eb6c7417e115eeada1233da2c8fa9600e09d2ffe3766bb1918'"
      - name: Capture baseline and candidate on the same retained real-resource profile
        run: |
          run_ready() {
            app="$1"; shift
            timeout 1800s dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --cwd=/tmp --filesystem="$PWD/candidate-checks":ro --filesystem="$RUNNER_TEMP" --filesystem="$PWD/reports" --env=PYTHONPATH="/app/lib/bible-python:$PWD/candidate-checks" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE="$language" --command=python3 "io.github.icfmp.Bible//$app" -X faulthandler -m tools.check_ready_reading_notes "$READY_PROFILE" "$PWD/reports/$label" --require-packaged "$@" > "reports/$label.log" 2>&1
          }
          language=fr;label=alpha24-fr;run_ready alpha --prepare --baseline
          for app in alpha master; do
            for case in 'youversion~YV21:Ps.34.2' 'KJV:Ps.119.1' 'KJV:Phlm.1.1'; do
              key=$(echo "$case" | tr '~:.' '---')
              timeout 400s dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD/candidate-checks":ro --filesystem="$RUNNER_TEMP" --filesystem="$PWD/reports" --env=PYTHONPATH="/app/lib/bible-python:$PWD/candidate-checks" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE=fr --command=python3 "io.github.icfmp.Bible//$app" -X faulthandler -m tools.profile_immersion_entry "$READY_PROFILE" "$PWD/reports/entry-$app-$key" --case "$case" --require-packaged > "reports/entry-$app-$key.log" 2>&1
            done
          done
          for language in fr en; do label="candidate-$language";run_ready master;done
          label=candidate-offline;language=fr
          timeout 500s dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD/candidate-checks":ro --filesystem="$RUNNER_TEMP" --filesystem="$PWD/reports" --env=PYTHONPATH="/app/lib/bible-python:$PWD/candidate-checks" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE=fr --command=python3 io.github.icfmp.Bible//master -m tools.check_ready_reading_notes "$READY_PROFILE" "$PWD/reports/$label" --require-packaged --offline > "reports/$label.log" 2>&1
      - name: Distinct Ready acceptance tests against installed application in both languages
        run: |
          for language in fr en; do
            timeout 300s dbus-run-session -- xvfb-run -a flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD/candidate-checks":ro --env=PYTHONPATH="/app/lib/bible-python:$PWD/candidate-checks" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=BIBLE_TEST_ISOLATED_CLICK=1 --env=LANGUAGE="$language" --command=python3 io.github.icfmp.Bible//master -X faulthandler -m unittest tests.test_ready_reading_notes tests.test_note_links tests.test_pagination -v > "reports/installed-tests-$language.log" 2>&1
            tail -n 5 "reports/installed-tests-$language.log"
          done
      - name: Shared notes on real translations, native citations, divider drag and narrow editors
        run: |
          for language in fr en; do
            timeout 300s dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$PWD/reports" --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD:$PWD/candidate-checks" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE="$language" --command=python3 io.github.icfmp.Bible//master -m tools.check_ready_notes_retention "$READY_PROFILE" "$PWD/reports/retention-$language" --require-packaged > "reports/retention-$language.log" 2>&1
          done
      - name: Bounded diagnostic logs
        if: failure()
        run: |
          for log in reports/*.log; do echo "$log";tail -n 40 "$log";done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-ready-reading-notes
          path: reports
          if-no-files-found: error
