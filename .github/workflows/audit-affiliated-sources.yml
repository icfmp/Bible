name: Examiner les sources de commentaires (#11)
on:
  push:
    branches: [feat/11-commentary-sources]
permissions:
  contents: write
  actions: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Lire les sources officielles et mesurer le catalogue
        run: python3 -m tools.audit_affiliated_sources
      - name: Arrêter les vérifications remplacées de cette branche
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          runs = json.loads(subprocess.check_output(['gh','run','list','--repo','icfmp/Bible','--branch','feat/11-commentary-sources','--workflow','prerequisites.yml','--json','databaseId,headSha,status'], text=True))
          for run in runs:
              if run['headSha'] != os.environ['GITHUB_SHA'] and run['status'] != 'completed':
                  subprocess.run(['gh','run','cancel',str(run['databaseId']),'--repo','icfmp/Bible'], check=True)
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: issue-11-source-audit
          path: affiliated-sources-audit.json
          if-no-files-found: error
      - name: Conserver les résultats mesurés avec le commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin refs/notes/source-audit:refs/notes/source-audit || true
          git notes --ref=source-audit add -f -F affiliated-sources-audit.json "$GITHUB_SHA"
          git push origin refs/notes/source-audit
