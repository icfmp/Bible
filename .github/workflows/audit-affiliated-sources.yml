name: Examiner les sources de commentaires (#11)
on:
  push:
    branches: [feat/11-commentary-sources]
permissions:
  contents: write
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Lire les sources officielles et mesurer le catalogue
        run: python3 -m tools.audit_affiliated_sources
      - name: Lire le diagnostic du premier essai réseau
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/icfmp/Bible/actions/jobs/118294350215/logs > /tmp/first-integration.log
          python3 - <<'PYTHON'
          import json, re
          from pathlib import Path
          path = Path('affiliated-sources-audit.json')
          data = json.loads(path.read_text())
          data['first_integration_log'] = re.sub(r'\x1b\[[0-9;]*[A-Za-z]', '', Path('/tmp/first-integration.log').read_text())[-22000:]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: issue-11-source-audit
          path: affiliated-sources-audit.json
          if-no-files-found: error
      - name: Conserver les résultats mesurés avec le commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin refs/notes/source-audit:refs/notes/source-audit || true
          git notes --ref=source-audit add -f -F affiliated-sources-audit.json "$GITHUB_SHA"
          git push origin refs/notes/source-audit
