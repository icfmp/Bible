name: Diagnostic de la préversion
on:
  push:
    branches: [release/0.1.0-alpha.1]
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Consigner l’état réel de GitHub dans une note Git
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path
          report = {}
          def capture(args):
              result = subprocess.run(args, text=True, capture_output=True)
              if result.returncode:
                  return {'exit_code': result.returncode, 'error': result.stderr.strip()}
              try:
                  return json.loads(result.stdout)
              except ValueError:
                  return result.stdout.strip()
          for name, endpoint in {
              'run': 'actions/runs/39280860527',
              'jobs': 'actions/runs/39280860527/jobs',
              'release': 'releases/tags/0.1.0-alpha.1',
              'releases': 'releases?per_page=10',
              'pulls': 'pulls?head=icfmp:release/0.1.0-alpha.1&state=all',
          }.items():
              report[name] = capture(['gh', 'api', 'repos/icfmp/Bible/' + endpoint])
          log = subprocess.run(['gh', 'run', 'view', '39280860527', '--job', '118155875127', '--log'], text=True, capture_output=True)
          report['publication_errors'] = [line for line in (log.stdout + log.stderr).splitlines()
              if any(marker in line for marker in ('Error:', 'error:', 'Traceback', 'HTTP ', 'AssertionError', 'CalledProcessError'))][-20:]
          report['recovery_run'] = capture(['gh', 'api', 'repos/icfmp/Bible/actions/runs/39282134761'])
          recovery_jobs = capture(['gh', 'api', 'repos/icfmp/Bible/actions/runs/39282134761/jobs?per_page=100'])
          report['recovery_jobs'] = recovery_jobs
          report['direct_logs'] = {}
          for job in recovery_jobs.get('jobs', []):
              result = subprocess.run(['gh', 'api', '--allow-escape-sequences', 'repos/icfmp/Bible/actions/jobs/' + str(job['id']) + '/logs'], text=True, capture_output=True)
              report['direct_logs'][job['name']] = {'exit_code': result.returncode,
                  'stderr': result.stderr, 'tail': re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', result.stdout).splitlines()[-100:]}
          Path('/tmp/release-status.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin refs/notes/releases:refs/notes/releases || true
          git notes --ref=releases add -f -F /tmp/release-status.json 3325a912effd65c776885cf722052bc57e468d41
          git push origin refs/notes/releases
