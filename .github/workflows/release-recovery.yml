name: Reprendre la publication de 0.1.0-alpha.1
on:
  push:
    branches: [release/0.1.0-alpha.1]
permissions:
  contents: read
jobs:
  verification:
    uses: ./.github/workflows/prerequisites.yml
    with:
      source_ref: 0.1.0-alpha.1
  publish:
    needs: verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 0.1.0-alpha.1
          path: source
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          path: publisher
      - uses: actions/download-artifact@v4
        with:
          name: Bible-alpha-linux-x86_64
          path: source/release-artifacts
      - name: Ouvrir la pull request de distribution
        working-directory: publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          result = subprocess.run(['gh', 'pr', 'view', 'release/0.1.0-alpha.1', '--json', 'url'], capture_output=True, text=True)
          if result.returncode:
              result = subprocess.run(['gh', 'pr', 'create', '--base', 'main', '--head', 'release/0.1.0-alpha.1', '--title', 'Préparer la préversion 0.1.0-alpha.1', '--body-file', 'docs/releases/PULL_REQUEST.md'], capture_output=True, text=True)
          Path('/tmp/release-pr.json').write_text(json.dumps({'returncode': result.returncode, 'stdout': result.stdout, 'stderr': result.stderr}))
          print(result.stdout, result.stderr)
          PY
      - name: Vérifier et publier le brouillon existant
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          BIBLE_RELEASE_RECOVERY: "1"
          BIBLE_RELEASE_NOTES: ../publisher/docs/releases/0.1.0-alpha.1.md
        run: |
          set -o pipefail
          python3 ../publisher/tools/ci_run.py python3 ../publisher/tools/publish_prerelease.py 2>&1 | tee /tmp/release-publication.log
      - name: Conserver les résultats de publication dans la note Git
        if: always()
        working-directory: publisher
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          result = subprocess.run(['gh','api','repos/icfmp/Bible/releases/417477427'],text=True,capture_output=True)
          report = {'status': os.environ['PUBLICATION_STATUS'], 'workflow': 'https://github.com/icfmp/Bible/actions/runs/'+os.environ['GITHUB_RUN_ID']}
          report['release'] = json.loads(result.stdout) if result.returncode == 0 else {'error': result.stderr}
          p=Path('/tmp/release-pr.json')
          if p.exists(): report['pull_request'] = json.loads(p.read_text())
          p=Path('/tmp/release-publication.log')
          if p.exists(): report['publication_log_tail'] = p.read_text().splitlines()[-35:]
          Path('/tmp/release-result.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin refs/notes/releases:refs/notes/releases || true
          git notes --ref=releases add -f -F /tmp/release-result.json 3325a912effd65c776885cf722052bc57e468d41
          git push origin refs/notes/releases
