name: Publish verified alignment alpha26 and original GTK evidence
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: numbered-alpha26-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: icfmp/Bible
    steps:
      - uses: actions/checkout@v6
      - name: Verify final source, required checks and immutable channel identity
        run: |
          python3 - <<'PY'
          import json,subprocess,time,urllib.request
          from pathlib import Path
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/icfmp/Bible/'+path],text=True))
          root=Path('tools/alignment215_numbered_delivery');r=json.loads((root/'verified-delivery.json').read_text())
          m=json.loads((root/'delivery.json').read_text());assert m['source']==r['source']
          assert r['candidate']=='6a2ad37e726b5fa8ba32ab82141e23e1b064c5a3' and r['numbered_tag']=='0.1.0-alpha.26'
          pr=api('pulls/234');assert pr['merged'] and pr['head']['sha']==r['candidate'] and pr['merge_commit_sha']==r['source']
          assert api('git/commits/'+r['source'])['tree']['sha']==api('git/commits/'+r['candidate'])['tree']['sha']
          for run in (r['ci'],r['candidate_ci'],r['installed_run'],r['study_run'],r['signed_run'],r['animations_run'],r['publication']):
              x=api('actions/runs/'+str(run));assert x['status']=='completed' and x['conclusion']=='success',(run,x['conclusion'])
          for key,path in (('ci','.github/workflows/prerequisites.yml'),('publication','.github/workflows/alpha-channel.yml')):
              x=api('actions/runs/'+str(r[key]));assert x['head_sha']==r['source'] and x['head_branch']=='main' and x['path']==path
          live=json.load(urllib.request.urlopen('https://icfmp.github.io/Bible/alpha/provenance.json?release='+str(time.time_ns())))
          assert live==r['provenance']
          assert live['signing_fingerprint']=='47A17230403EA4953745E6E020EB9FFCCECAFD8F'
          assert live['ref']=='app/io.github.icfmp.Bible/x86_64/alpha' and live['remote']=='bible-alpha'
          assert api('git/ref/tags/0.1.0-alpha.25')['object']['sha']=='c7009d0162c0b2b85cc8f99e5b024e17e764bd3e'
          PY
      - name: Reuse existing verified native artifacts without rebuilding the app
        run: |
          python3 - <<'PY'
          import hashlib,json,shutil,subprocess,zipfile
          from pathlib import Path,PurePosixPath
          root=Path('tools/alignment215_numbered_delivery');base=Path('/tmp/alignment215-numbered');base.mkdir()
          m=json.loads((root/'delivery.json').read_text())
          for key,value in m['artifacts'].items():
              folder=PurePosixPath(value['folder']);assert not folder.is_absolute() and '..' not in folder.parts
              archive=base/(key+'.zip')
              with archive.open('wb') as stream:subprocess.run(['gh','api','repos/icfmp/Bible/actions/artifacts/'+str(value['id'])+'/zip'],stdout=stream,check=True)
              assert hashlib.sha256(archive.read_bytes()).hexdigest()==value['digest'].removeprefix('sha256:')
              with zipfile.ZipFile(archive) as z:
                  assert all(not PurePosixPath(n).is_absolute() and '..' not in PurePosixPath(n).parts for n in z.namelist())
                  z.extractall(base/folder)
          for p in root.iterdir():
              if p.is_file():shutil.copyfile(p,base/p.name)
          PY
          python3 /tmp/alignment215-numbered/assemble_release_evidence.py
      - name: Publish exactly one numbered prerelease on the verified source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          result=json.loads(subprocess.check_output(['gh','api','repos/icfmp/Bible/git/matching-refs/tags/0.1.0-alpha.26'],text=True))
          assert all(x['ref']!='refs/tags/0.1.0-alpha.26' for x in result),'Tag already exists; never move a published tag'
          m=json.loads(Path('/tmp/alignment215-numbered/delivery.json').read_text())
          assets=sorted(str(p) for p in Path('/tmp/alignment215-numbered/alpha26-assets').iterdir() if p.is_file())
          assert len(assets)==7
          subprocess.run(['gh','release','create','0.1.0-alpha.26','--target',m['source'],'--prerelease','--title','Bible 0.1.0-alpha.26','--notes-file','/tmp/alignment215-numbered/release-notes.md',*assets],check=True)
          PY
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/icfmp/Bible/'+path],text=True))
          base=Path('/tmp/alignment215-numbered');m=json.loads((base/'delivery.json').read_text())
          tag=api('git/ref/tags/0.1.0-alpha.26');assert tag['object']['type']=='commit' and tag['object']['sha']==m['source']
          r=api('releases/tags/0.1.0-alpha.26');assert r['prerelease'] and not r['draft']
          expected={p.name:p for p in (base/'alpha26-assets').iterdir() if p.is_file()}
          assert {a['name'] for a in r['assets']}==set(expected)
          for a in r['assets']:
              p=expected[a['name']];assert a['size']==p.stat().st_size and a['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          (base/'numbered-publication.json').write_text(json.dumps(dict(url=r['html_url'],source=m['source'],release_id=r['id'],assets=[dict(name=a['name'],digest=a['digest'],size=a['size']) for a in r['assets']]),indent=2))
          print(r['html_url'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numbered-alpha26-publication-evidence
          path: |
            /tmp/alignment215-numbered/alpha26-assets
            /tmp/alignment215-numbered/numbered-publication.json
