name: Verify signed alignment update with retained linked annotations
on:
  workflow_dispatch:
    inputs:
      candidate_head:
        description: Exact reviewed application PR head
        required: true
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: alignment215-signed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_HEAD: ${{ inputs.candidate_head }}
    steps:
      - uses: actions/checkout@v6
      - name: Install isolated validation tools and signed alpha25
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update -qq
          sudo apt-get install -y flatpak xvfb xauth dbus-x11 xcompmgr ostree
          echo "FLATPAK_USER_DIR=$RUNNER_TEMP/signed-flatpak" >> "$GITHUB_ENV"
          echo "ALIGNMENT_PROFILE=$RUNNER_TEMP/retained-profile" >> "$GITHUB_ENV"
          mkdir reports
          export FLATPAK_USER_DIR="$RUNNER_TEMP/signed-flatpak"
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive https://icfmp.github.io/Bible/alpha/Bible.flatpakref
          python3 - <<'PY'
          import json,subprocess,urllib.request
          from pathlib import Path
          d=json.load(urllib.request.urlopen('https://icfmp.github.io/Bible/alpha/provenance.json'))
          assert d['source_commit']=='c7009d0162c0b2b85cc8f99e5b024e17e764bd3e'
          assert d['flatpak_commit']=='0841dca6e6d3cd1d191314e2ffde228151f298c3186773ab4972d3b185cbaba2'
          assert d['signing_fingerprint']=='47A17230403EA4953745E6E020EB9FFCCECAFD8F'
          assert subprocess.check_output(['flatpak','info','--user','--show-commit','io.github.icfmp.Bible//alpha'],text=True).strip()==d['flatpak_commit']
          Path('reports/before-provenance.json').write_text(json.dumps(d,indent=2))
          PY
          ostree show --repo="$FLATPAK_USER_DIR/repo" --gpg-verify-remote=bible-alpha 0841dca6e6d3cd1d191314e2ffde228151f298c3186773ab4972d3b185cbaba2 > reports/before-signature.txt
      - name: Reproduce failures with real resources on the retained profile
        run: |
          timeout 900s dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --filesystem="$PWD/reports" --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE=fr --command=python3 io.github.icfmp.Bible//alpha -m tools.check_alignment_regression "$ALIGNMENT_PROFILE" "$PWD/reports/before-fr" --prepare --baseline --require-packaged > reports/before-fr.log 2>&1
      - name: Seed linked annotations including unavailable original references
        run: |
          flatpak run --user --cwd=/tmp --filesystem="$RUNNER_TEMP" --env=PYTHONPATH=/app/lib/bible-python --command=python3 io.github.icfmp.Bible//alpha - "$ALIGNMENT_PROFILE" <<'PY'
          import hashlib,json,sys
          from dataclasses import asdict
          from pathlib import Path
          from bible.notes import NoteStore,PassageLink
          from bible.highlights import HighlightStore
          root=Path(sys.argv[1]);notes=NoteStore(root/'notes.sqlite3')
          notes.save('**Synthetic retained annotation** — é α שלום',('Retained','Unicode'),versification='YouVersion152',start='Num.25.1',end='Num.25.2',origin_translation='youversion~YV152',origin_language='fr',links=(PassageLink('KJV','John.3.16','John.3.16'),PassageLink('YouVersion133','Zech.4.1','Zech.4.2')))
          marks=HighlightStore(root/'highlights.json');marks.set('YouVersion152',['Num.25.1'],'blue','youversion~YV152')
          data=dict(notes=[asdict(n) for n in notes.all()],preferences=hashlib.sha256((root/'reading-preferences.json').read_bytes()).hexdigest(),highlights=hashlib.sha256((root/'highlights.json').read_bytes()).hexdigest(),modules={str(f.relative_to(root/'translations')):hashlib.sha256(f.read_bytes()).hexdigest() for f in (root/'translations').rglob('*') if f.is_file()},indexes={str(f.relative_to(root/'reference-indexes')):hashlib.sha256(f.read_bytes()).hexdigest() for f in (root/'reference-indexes').rglob('*') if f.is_file()})
          (root/'before.json').write_text(json.dumps(data));notes.close()
          PY
      - name: Wait for reviewed merge, full main CI and exact signed deployment
        run: |
          python3 - <<'PY'
          import json,os,subprocess,time,urllib.request
          from pathlib import Path
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/icfmp/Bible/'+path],text=True))
          for attempt in range(180):
              p=api('pulls/234');assert p['head']['sha']==os.environ['CANDIDATE_HEAD']
              if p['merged']:
                  source=p['merge_commit_sha']
                  assert api('git/commits/'+source)['tree']['sha']==api('git/commits/'+os.environ['CANDIDATE_HEAD'])['tree']['sha']
                  try:d=json.load(urllib.request.urlopen('https://icfmp.github.io/Bible/alpha/provenance.json?validation='+str(time.time_ns())))
                  except OSError:time.sleep(20);continue
                  if d['source_commit']==source:
                      ci=api('actions/runs/'+str(d['ci_run']));publication=api('actions/runs/'+d['packaging_revision'].rsplit('-',1)[0])
                      if ci['conclusion']=='success' and publication['conclusion']=='success':
                          assert ci['head_sha']==source and ci['head_branch']=='main' and ci['path']=='.github/workflows/prerequisites.yml'
                          assert publication['head_sha']==source and publication['path']=='.github/workflows/alpha-channel.yml'
                          before=json.loads(Path('reports/before-provenance.json').read_text())
                          for k in ('signing_fingerprint','remote','ref'):assert d[k]==before[k]
                          Path('reports/after-provenance.json').write_text(json.dumps(d,indent=2));break
              time.sleep(20)
          else:raise RuntimeError('Reviewed source has not passed main CI and signed deployment')
          PY
      - name: Update the actual installed alpha without replacing its profile
        run: |
          flatpak update --user --noninteractive io.github.icfmp.Bible//alpha
          python3 - <<'PY'
          import json,subprocess,hashlib
          from pathlib import Path
          d=json.loads(Path('reports/after-provenance.json').read_text())
          assert subprocess.check_output(['flatpak','info','--user','--show-commit','io.github.icfmp.Bible//alpha'],text=True).strip()==d['flatpak_commit']
          assert subprocess.check_output(['flatpak','info','--user','--show-origin','io.github.icfmp.Bible//alpha'],text=True).strip()==d['remote']
          for name in ('source_versification.py','versification_mapping.py','scroll_motion.py','reading_sync.py','comparison_sync.py','study_panel.py'):
              script="import hashlib;from pathlib import Path;print(hashlib.sha256(Path('/app/lib/bible-python/bible/"+name+"').read_bytes()).hexdigest())"
              actual=subprocess.check_output(['flatpak','run','--user','--command=python3','io.github.icfmp.Bible//alpha','-c',script],text=True).strip()
              assert actual==hashlib.sha256(Path('bible',name).read_bytes()).hexdigest()
          Path('reports/signed-update.json').write_text(json.dumps(dict(updated=True,profile_reused=True,source=d['source_commit'],flatpak_commit=d['flatpak_commit'],remote=d['remote'],ref=d['ref'])))
          PY
          commit=$(python3 -c "import json;print(json.load(open('reports/after-provenance.json'))['flatpak_commit'])")
          ostree show --repo="$FLATPAK_USER_DIR/repo" --gpg-verify-remote=bible-alpha "$commit" > reports/after-signature.txt
      - name: Validate final signed source in French, English and offline restart
        run: |
          for language in fr en; do
            timeout 900s dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$PWD/reports" --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE="$language" --command=python3 io.github.icfmp.Bible//alpha -m tools.check_alignment_regression "$ALIGNMENT_PROFILE" "$PWD/reports/signed-$language" --offline --require-packaged > "reports/signed-$language.log" 2>&1
          done
          timeout 600s dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1100x24' /usr/bin/python3 -m tools.composited_x11 flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$PWD/reports" --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --env=LANGUAGE=fr --command=python3 io.github.icfmp.Bible//alpha -m tools.check_alignment_commentary_gestures "$ALIGNMENT_PROFILE" "$PWD/reports/signed-study" --require-packaged > reports/signed-study.log 2>&1
          timeout 300s dbus-run-session -- xvfb-run -a /usr/bin/python3 -m tools.composited_x11 flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=BIBLE_TEST_ISOLATED_CLICK=1 --command=python3 io.github.icfmp.Bible//alpha -m unittest tests.test_declared_reference_convention tests.test_reference_resolution tests.test_versification_mapping tests.test_note_links tests.test_scroll_motion tests.test_reading_sync tests.test_comparison_sync -v > reports/signed-native-tests.log 2>&1
      - name: Verify canonical reference consumers and exact retained data
        run: |
          flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$RUNNER_TEMP" --filesystem="$PWD/reports" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --command=python3 io.github.icfmp.Bible//alpha - "$ALIGNMENT_PROFILE" "$PWD/reports" <<'PY'
          import json,hashlib,sys
          from pathlib import Path
          from dataclasses import asdict
          from bible.notes import NoteStore
          from bible.sword_provider import Reader
          from bible.reference_targets import source_references,destination
          from tools.check_alignment_regression import BIBLES
          root,out=map(Path,sys.argv[1:]);before=json.loads((root/'before.json').read_text());notes=NoteStore(root/'notes.sqlite3')
          assert json.loads(json.dumps([asdict(n) for n in notes.all()]))==before['notes']
          for key,name in [('preferences','reading-preferences.json'),('highlights','highlights.json')]:assert hashlib.sha256((root/name).read_bytes()).hexdigest()==before[key]
          for key,folder in [('modules','translations'),('indexes','reference-indexes')]:
              actual={str(f.relative_to(root/folder)):hashlib.sha256(f.read_bytes()).hexdigest() for f in (root/folder).rglob('*') if f.is_file()};assert actual==before[key]
          routes=[]
          for name in BIBLES:
              reader=Reader(root/'translations'/name,name);ref='Ps.3.2' if name=='KJV' else 'Ps.3.3'
              assert source_references(reader,ref,ref)==['Ps.3.2']
              mapped=destination('Ps.3.2',reader);assert mapped.start==mapped.end==ref
              routes.append(dict(resource=name,local=ref,canonical='Ps.3.2'))
          for language in ('fr','en'):
              d=json.loads((out/('signed-'+language)/'alignment.json').read_text());assert d['complete'] and d['preserved'] and len(d['resolver'])==294 and d['fidelity_verses']>0 and d['renderer']=='GLRenderer' and d['offline']
          assert json.loads((out/'signed-en/alignment.json').read_text())['restored_session_verified']
          d=json.loads((out/'signed-study/commentary-gestures.json').read_text());assert d['complete'] and len(d['checks'])==30 and len(d['handoffs'])==9
          (out/'preservation.json').write_text(json.dumps(dict(preserved=True,linked_notes_preserved=True,unavailable_source_references_preserved=True,notes=len(before['notes']),module_files=len(before['modules']),reference_indexes=len(before['indexes']),canonical_routes=routes),indent=2));notes.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-alignment215-update-evidence
          path: reports
