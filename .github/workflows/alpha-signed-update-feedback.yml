name: Verify ready batch signed update and retained real data
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact merged application source expected on signed alpha
        required: true
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      EXPECTED_SOURCE: ${{ inputs.source }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source }}
      - name: Prepare an isolated real Flatpak client
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt; fi
          sudo apt-get update -qq
          sudo apt-get install -y flatpak ostree gnupg xvfb xauth dbus-x11 xcompmgr gnome-software gnome-software-plugin-flatpak appstream python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 python3-sword
          echo "FLATPAK_USER_DIR=$RUNNER_TEMP/ready-retained-flatpak" >> "$GITHUB_ENV"
          echo "READY_PROFILE=$RUNNER_TEMP/ready-retained-profile" >> "$GITHUB_ENV"
          mkdir reports
      - name: Install and verify the still-published alpha26
        run: |
          python3 - <<'PY'
          import json,urllib.request
          from pathlib import Path
          x=json.load(urllib.request.urlopen('https://icfmp.github.io/Bible/alpha/provenance.json',timeout=30))
          assert x['source_commit']=='6faab9201d4fdf496ccb931c62b1cf9aa9e7f233',x['source_commit']
          assert x['signing_fingerprint']=='47A17230403EA4953745E6E020EB9FFCCECAFD8F'
          Path('reports/before-provenance.json').write_text(json.dumps(x,indent=2))
          PY
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive https://icfmp.github.io/Bible/alpha/Bible.flatpakref
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          x=json.loads(Path('reports/before-provenance.json').read_text())
          assert subprocess.check_output(['flatpak','info','--user','--show-commit','io.github.icfmp.Bible//alpha'],text=True).strip()==x['flatpak_commit']
          PY
      - name: Prepare real resources, saved preferences and linked annotations once
        id: prepare
        run: |
          flatpak run --user --filesystem="$RUNNER_TEMP" --command=python3 io.github.icfmp.Bible//alpha - "$READY_PROFILE" <<'PY'
          from dataclasses import asdict
          import hashlib,json,sys
          from pathlib import Path
          from bible.library import Library,catalogue
          from bible.notes import NoteStore,PassageLink
          from bible.highlights import HighlightStore
          from bible.preferences import Preferences
          from bible.step_data import StepData
          from bible.place_data import PlaceData
          from bible.reference_data import ReferenceData
          from bible.topic_data import TopicData
          from bible.session import SessionStore,Session,TabState
          root=Path(sys.argv[1]);root.mkdir();library=Library(root/'translations');resources=catalogue()
          for name in ('FreSegond1910','KJV','Wesley'):
              library.install(next(r for r in resources if r.name==name))
          for cls in (StepData,PlaceData,ReferenceData,TopicData):cls(root/'study-data').install()
          notes=NoteStore(root/'notes.sqlite3');notes.save('**Retained update test** — John3:16. A synthetic personal note.',('keep','étiquette'),versification='KJV',start='John.3.16',end='John.3.16',origin_translation='KJV',origin_language='en',links=(PassageLink('KJV','Gen.1.1','Gen.1.1'),))
          marks=HighlightStore(root/'highlights.json');marks.set('KJV',['John.3.16'],'yellow','KJV')
          prefs=Preferences(root/'reading-preferences.json');prefs.value.size=24;prefs.value.font='DejaVu Serif';prefs.value.serif_font='DejaVu Serif';prefs.value.sans_font='DejaVu Sans';prefs.save()
          SessionStore(root/'session.json').save(Session([TabState(resource='FreSegond1910',reference='Ps.119.1',comparison='KJV',commentary='Wesley',study_visible=True)]))
          receipt=dict(notes=[asdict(n) for n in notes.all()],preferences_sha256=hashlib.sha256(prefs.path.read_bytes()).hexdigest(),highlights_sha256=hashlib.sha256(marks.path.read_bytes()).hexdigest(),modules={str(p.relative_to(library.root)):hashlib.sha256(p.read_bytes()).hexdigest() for p in library.root.rglob('*') if p.is_file()},study_data={str(p.relative_to(root/'study-data')):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'study-data').rglob('*') if p.is_file()})
          (root/'preservation-before.json').write_text(json.dumps(receipt,indent=2));notes.close()
          PY
      - name: Measure native input on the previous signed alpha
        run: |
          for mode in single comparison study; do
            dbus-run-session -- xvfb-run -a /usr/bin/python3 -m tools.composited_x11 flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$PWD/reports" --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --command=python3 io.github.icfmp.Bible//alpha -m tools.check_sustained_scroll "$READY_PROFILE" "$PWD/reports/before-$mode.json" --mode "$mode" --require-packaged --check > "reports/before-$mode.log" 2>&1
          done
      - name: Wait for the exact merged source and its verified signed publication
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess,time,urllib.request
          from pathlib import Path
          expected=os.environ['EXPECTED_SOURCE'];assert re.fullmatch('[0-9a-f]{40}',expected)
          for attempt in range(240):
              try:
                  request=urllib.request.Request('https://icfmp.github.io/Bible/alpha/provenance.json?ready-check='+str(time.time_ns()),headers={'Cache-Control':'no-cache'})
                  x=json.load(urllib.request.urlopen(request,timeout=20))
                  if x['source_commit']==expected:
                      deployment=x['packaging_revision'].rsplit('-',1)[0]
                      run=json.loads(subprocess.check_output(['gh','api','repos/icfmp/Bible/actions/runs/'+deployment],text=True))
                      if run['status']=='completed' and run['conclusion']=='success':break
              except Exception as e:print(type(e).__name__,flush=True)
              time.sleep(15)
          else:raise RuntimeError('Expected source did not reach a successful signed deployment')
          before=json.loads(Path('reports/before-provenance.json').read_text())
          for key in ('signing_fingerprint','remote','ref'):assert before[key]==x[key],key
          Path('reports/after-provenance.json').write_text(json.dumps(x,indent=2))
          PY
      - name: Update the retained client and keep GPG verification enabled
        run: |
          flatpak update --user --noninteractive io.github.icfmp.Bible//alpha
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          x=json.loads(Path('reports/after-provenance.json').read_text());app='io.github.icfmp.Bible//alpha'
          actual={k:subprocess.check_output(['flatpak','info','--user','--show-'+k,app],text=True).strip() for k in ('origin','ref','commit')}
          assert actual['origin']==x['remote'] and actual['ref']==x['ref'] and actual['commit']==x['flatpak_commit']
          repo=Path(os.environ['FLATPAK_USER_DIR'],'repo')
          for key in ('gpg-verify','gpg-verify-summary'):assert subprocess.check_output(['ostree','--repo='+str(repo),'config','get','remote "bible-alpha".'+key],text=True).strip()=='true'
          Path('reports/signed-update.json').write_text(json.dumps(dict(updated=True,actual=actual,source=x['source_commit'],stable_key=x['signing_fingerprint']),indent=2))
          PY
      - name: Verify sustained scrolling and first-event dismissal after the real update
        run: |
          for mode in single comparison study; do
            dbus-run-session -- xvfb-run -a /usr/bin/python3 -m tools.composited_x11 flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$PWD/reports" --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --command=python3 io.github.icfmp.Bible//alpha -m tools.check_sustained_scroll "$READY_PROFILE" "$PWD/reports/after-$mode.json" --mode "$mode" --require-packaged --check > "reports/after-$mode.log" 2>&1
          done
          dbus-run-session -- xvfb-run -a /usr/bin/python3 -m tools.composited_x11 flatpak run --user --unshare=network --cwd=/tmp --filesystem="$PWD":ro --filesystem="$PWD/reports" --filesystem="$RUNNER_TEMP" --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=gl --env=LIBGL_ALWAYS_SOFTWARE=1 --env=GTK_A11Y=none --command=python3 io.github.icfmp.Bible//alpha -m tools.check_sustained_scroll "$READY_PROFILE" "$PWD/reports/after-toolbar.json" --toolbar --require-packaged --check > reports/after-toolbar.log 2>&1
      - name: Verify notes, linked references, preferences, highlights and all real resource files
        if: always() && steps.prepare.outcome == 'success'
        run: |
          flatpak run --user --unshare=network --filesystem="$RUNNER_TEMP" --filesystem="$PWD/reports" --command=python3 io.github.icfmp.Bible//alpha - "$READY_PROFILE" "$PWD/reports/preservation.json" <<'PY'
          from dataclasses import asdict
          import hashlib,json,sys
          from pathlib import Path
          from bible.notes import NoteStore
          root=Path(sys.argv[1]);before=json.loads((root/'preservation-before.json').read_text());notes=NoteStore(root/'notes.sqlite3')
          after=dict(notes=[asdict(n) for n in notes.all()],preferences_sha256=hashlib.sha256((root/'reading-preferences.json').read_bytes()).hexdigest(),highlights_sha256=hashlib.sha256((root/'highlights.json').read_bytes()).hexdigest(),modules={str(p.relative_to(root/'translations')):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'translations').rglob('*') if p.is_file()},study_data={str(p.relative_to(root/'study-data')):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'study-data').rglob('*') if p.is_file()})
          after=json.loads(json.dumps(after));differences=[key for key in before if before[key]!=after[key]]
          assert not differences,'Changed retained components: '+str(differences)
          Path(sys.argv[2]).write_text(json.dumps(dict(preserved=True,notes=len(after['notes']),linked_passages=sum(len(n['links']) for n in after['notes']),module_files=len(after['modules']),study_files=len(after['study_data']),profile_reused=True),indent=2))
          PY
      - name: Verify the updated signed alpha details in GNOME Software
        run: |
          flatpak update --user --appstream --noninteractive bible-alpha
          dbus-run-session -- xvfb-run -a -s '-screen 0 1440x1000x24' /usr/bin/python3 -m tools.composited_x11 bash -c '
            set -euo pipefail
            export XDG_DATA_DIRS="$FLATPAK_USER_DIR/exports/share:/usr/local/share:/usr/share"
            export GTK_A11Y=none
            gnome-software --mode=overview > reports/gnome-software.log 2>&1 &
            software_pid=$!
            python3 - <<'"'"'PY'"'"'
          import os,subprocess,time,json
          from pathlib import Path
          from tools.check_alpha_ui import X11Input
          from tools.check_client_feedback import Screen
          native=X11Input();screen=Screen(native);time.sleep(10);results=[]
          for component in ("io.github.icfmp.Bible","io.github.icfmp.Bible.desktop"):
              p=subprocess.run(["gnome-software","--details="+component],capture_output=True,text=True,timeout=30)
              results.append(dict(component=component,status=p.returncode,stdout=p.stdout,stderr=p.stderr))
              time.sleep(8);screen.grab(Path("reports/software-"+component+".png"))
          Path("reports/software-requests.json").write_text(json.dumps(results,indent=2));native.close()
          PY
            kill "$software_pid" || true
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ready-204-232-signed-update
          path: reports/
