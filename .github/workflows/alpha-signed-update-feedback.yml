name: Publish verified Ready numbered alpha and native evidence
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: numbered-alpha25-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: icfmp/Bible
    steps:
      - uses: actions/checkout@v6
      - name: Verify immutable source and successful delivery receipts
        run: |
          python3 - <<'PY'
          import json,subprocess,urllib.request
          from pathlib import Path
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/icfmp/Bible/'+path],text=True))
          root=Path('tools/ready_numbered_delivery');r=json.loads((root/'final-delivery-receipt.json').read_text())
          assert r['source']=='c7009d0162c0b2b85cc8f99e5b024e17e764bd3e'
          assert r['numbered_tag']=='0.1.0-alpha.25'
          for run in (r['ci'],r['proof'],r['update'],r['publication']):
              x=api(f'actions/runs/{run}');assert x['status']=='completed' and x['conclusion']=='success'
          assert api('actions/runs/'+str(r['ci']))['head_sha']==r['source']
          current=json.load(urllib.request.urlopen('https://icfmp.github.io/Bible/alpha/provenance.json'))
          assert current==r['provenance'],current
          assert current['signing_fingerprint']=='47A17230403EA4953745E6E020EB9FFCCECAFD8F'
          m=json.loads((root/'memory-validation.json').read_text());assert m['source']==r['source'] and m['plateau_observed'] and m['cycles']==24
          PY
      - name: Download existing exact-source native evidence without rebuilding
        run: |
          gh api repos/icfmp/Bible/actions/artifacts/13524031815/zip > "$RUNNER_TEMP/core.zip"
          gh api repos/icfmp/Bible/actions/artifacts/13537946164/zip > "$RUNNER_TEMP/signed.zip"
          python3 - <<'PY'
          import os,hashlib,zipfile,shutil
          from pathlib import Path,PurePosixPath
          base=Path('/tmp/bible-ready-benchmark');base.mkdir()
          sources=(('core.zip','final-installed-proof','000e8db3fc8d6fac6b5edfaf360c9655f0b8b5000a1e817e0696aaeda69168c4'),('signed.zip','final-renderer-update','dd9d7a0b636910253a53f2d3035c64fa6afe76b59ab72a46ca6779f43708c873'))
          for name,dest,digest in sources:
              p=Path(os.environ['RUNNER_TEMP'])/name;assert hashlib.sha256(p.read_bytes()).hexdigest()==digest
              with zipfile.ZipFile(p) as z:
                  assert all(not PurePosixPath(n).is_absolute() and '..' not in PurePosixPath(n).parts for n in z.namelist())
                  z.extractall(base/dest)
          for p in Path('tools/ready_numbered_delivery').iterdir():
              if p.is_file():shutil.copyfile(p,base/p.name)
          PY
          python3 /tmp/bible-ready-benchmark/assemble-release-evidence.py
      - name: Publish one numbered prerelease on the exact verified commit
        run: |
          set -euo pipefail
          if gh api repos/icfmp/Bible/git/ref/tags/0.1.0-alpha.25 > "$RUNNER_TEMP/existing-tag.json" 2>/dev/null; then
            echo 'Tag already exists; do not move or republish it.' >&2
            exit 1
          fi
          gh release create 0.1.0-alpha.25 --target c7009d0162c0b2b85cc8f99e5b024e17e764bd3e --prerelease --title 'Bible 0.1.0-alpha.25' --notes-file /tmp/bible-ready-benchmark/alpha25-release-notes.md /tmp/bible-ready-benchmark/alpha25-assets/*
          python3 - <<'PY'
          import json,subprocess,hashlib
          from pathlib import Path
          def api(path):return json.loads(subprocess.check_output(['gh','api','repos/icfmp/Bible/'+path],text=True))
          tag=api('git/ref/tags/0.1.0-alpha.25');assert tag['object']['type']=='commit' and tag['object']['sha']=='c7009d0162c0b2b85cc8f99e5b024e17e764bd3e'
          r=api('releases/tags/0.1.0-alpha.25');assert not r['draft'] and r['prerelease']
          expected={p.name:p for p in Path('/tmp/bible-ready-benchmark/alpha25-assets').iterdir() if p.is_file()}
          assert {a['name'] for a in r['assets']}==set(expected)
          for a in r['assets']:
              p=expected[a['name']];assert a['size']==p.stat().st_size and a['digest']=='sha256:'+hashlib.sha256(p.read_bytes()).hexdigest()
          print(r['html_url'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numbered-alpha25-publication-evidence
          path: /tmp/bible-ready-benchmark/alpha25-assets
