name: Verify published commentary OSIS formatting issue 329
on:
  push:
    branches: [fix/commentary-osis-paragraphs-emphasis-329]
    paths:
      - '.github/workflows/probe-commentary-329.yml'
      - 'bible/commentary_format.py'
      - 'tests/test_commentary_format.py'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install reader and verified published 0.1.0 package
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-sword diatheke
          curl -fLSs --retry 3 -o /tmp/hmcc-0.1.0.zip 'https://github.com/icfmp/Bible-Resources/releases/download/hmcc-modern-0.1.0/HMCCModern-0.1.0.zip'
          echo 'dd1940b3bf85cc09659b634dc74c9a9d8810816bc2f8316a8293f893c3eb94ee  /tmp/hmcc-0.1.0.zip' | sha256sum -c -
          mkdir -p /tmp/sword-hmcc
          unzip -q /tmp/hmcc-0.1.0.zip -d /tmp/sword-hmcc
      - name: Run source-verified commentary formatting unit regressions
        run: |
          /usr/bin/python3 -m unittest tests.test_commentary_format.CommentaryFormatTests -v
      - name: Read real native OSIS and filtered text without publishing content
        env:
          SWORD_PATH: /tmp/sword-hmcc
        run: |
          /usr/bin/python3 - <<'PY'
          import Sword, os, re, sys
          from pathlib import Path
          sys.path.insert(0,str(Path.cwd()))
          from bible.commentary_format import format_entry
          mgr=Sword.SWMgr(os.environ['SWORD_PATH'])
          module=mgr.getModule('HMCCModern')
          assert module, 'Published HMCCModern module missing'
          print('SourceType',module.getConfigEntry('SourceType'))
          key=Sword.VerseKey('Gen.10.8')
          key.setVersificationSystem('KJV')
          module.setKey(key)
          raw=str(module.getRawEntry())
          plain=str(module.stripText())
          print('raw_len',len(raw),'plain_len',len(plain))
          print('raw_p_tags',len(re.findall(r'<p\\b',raw)),'raw_bold_tags',len(re.findall(r'<hi\\b[^>]*\\btype=["\\\']bold',raw,re.I)))
          print('raw_genesis6_anchor', 'Gen.6.4' in raw)
          for word in ['day.Before','households.Nimrod','neighbors.The','him.Nimrod','hunter.Hunting','dangerous.It','leadership.It']:
              print('join_'+word, word in plain)
          formatted,styles,titles=format_entry(raw,plain,'OSIS')
          print('formatting_fallback', formatted==plain and not styles and not titles)
          print('formatted_len',len(formatted),'newline_count',formatted.count('\n'),'hidden',sum(x[2]-x[1] for x in styles if x[0]=='hidden'),'bold',sum(1 for x in styles if x[0]=='bold'))
          from html.parser import HTMLParser
          class Probe(HTMLParser):
              def __init__(self): super().__init__();self.tags=[] 
              def handle_starttag(self,t,a): self.tags.append((t,dict(a)))
              def handle_startendtag(self,t,a): self.tags.append((t,dict(a)))
          hp=Probe();hp.feed(raw)
          print('tags',len(hp.tags),'paragraph_tags',sum(t=='p' for t,a in hp.tags),'bold_hi',sum(t=='hi' and a.get('type')=='bold' for t,a in hp.tags))
          print('first_tags',hp.tags[:12])
          from bible.commentary_format import InlineOSIS,split_preverse
          parser=InlineOSIS('OSIS');parser.feed(split_preverse(raw)[0]);parser.close()
          expected=''.join(parser.parts)
          key=lambda v: ''.join(c for c in v if not c.isspace() and c!='*')
          a,b=key(expected),key(plain)
          print('plain_core_len',len(b),'expected_core_len',len(a),'core_equal',a==b,'raw_emphases',len(parser.emphasis),'raw_boundaries',len(parser.paragraphs))
          if a!=b:
              first=next((i for i in range(min(len(a),len(b))) if a[i]!=b[i]),min(len(a),len(b)))
              print('first_core_difference',first,'expected_context',repr(a[max(0,first-35):first+50]),'plain_context',repr(b[max(0,first-35):first+50]))
          print('plain_stars',plain.count('*'),'expected_stars',expected.count('*'))
          # This exact released module is the regression fixture, not a
          # hand-made replacement for what SWORD really emits.
          assert not (formatted==plain and not styles), 'Unexpected fallback to raw SWORD plain text'
          assert len(parser.emphasis)==4
          assert sum(kind=='bold' for kind,_,_ in styles)==4
          assert formatted.count('\n\n')>=10
          assert not any(word in formatted for word in ['day.Before','households.Nimrod','neighbors.The','him.Nimrod','hunter.Hunting','dangerous.It','leadership.It'])
          assert 'Nimrod, a mighty hunter' in titles[0]
          print('REAL_PUBLISHED_SWORD_LAYOUT_PASS')
          PY
