name: Vérifier le socle GNOME

on:
  push:
    branches: [main, 'feat/**']
    # Distribution-only maintenance reuses the already verified application.
    paths-ignore:
      - 'tools/alpha_storage.py'
      - 'tests/test_alpha_storage.py'
      - 'tools/flatpak_channel.py'
      - 'tools/check_flatpak_channel.py'
      - 'tools/site_render.py'
      - 'tools/site_assets/index.html'
      - '.github/workflows/*channel*.yml'
      - '.github/workflows/prerequisites.yml'
      - 'docs/CANAL_ALPHA_FLATPAK.md'
  workflow_dispatch:

concurrency:
  group: prerequisites-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prerequisites:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
      - name: Consulter les recommandations GNOME actuelles
        run: /usr/bin/python3 tools/inspect_gnome_hig.py
      - name: Examiner les sources officielles CrossWire et YouVersion
        run: /usr/bin/python3 -m tools.inspect_sources
      - name: Installer GTK 4, libadwaita et Flatpak
        run: |
          # Match the established Flatpak/publication mirror configuration.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 flatpak flatpak-builder python3-sword python3-babel iso-codes fonts-dejavu-core fonts-dejavu-extra xvfb xauth dbus-x11 libxtst6
      - name: Examiner les paquets SWORD disponibles
        run: |
          apt-cache search --names-only 'sword|libsword' | head -80
      - name: Vérifier les dépendances et les accès réseau
        run: |
          /usr/bin/python3 tools/check_environment.py --network
      - name: Tests locaux et fenêtre GTK sous Xvfb
        env:
          GSK_RENDERER: cairo
        run: |
          set -o pipefail
          /usr/bin/python3 tools/ci_run.py dbus-run-session -- xvfb-run -a /usr/bin/python3 -m unittest discover -v | tee test-results.log
          LANGUAGE=fr /usr/bin/python3 tools/ci_run.py dbus-run-session -- xvfb-run -a /usr/bin/python3 -m unittest tests.test_ui tests.test_alpha_ui tests.test_provider_ui tests.test_workspace_features tests.test_appearance tests.test_immersion tests.test_reading_sync tests.test_pagination tests.test_reading_direction tests.test_library_polish tests.test_annotation_workspace tests.test_chapter_notes tests.test_finishing tests.test_personal_backup tests.test_personal_backup_ui -v | tee ui-fr-results.log
      - name: Interactions souris et clavier réelles sous Xvfb
        env:
          LANGUAGE: fr
          GSK_RENDERER: cairo
        run: |
          set -o pipefail
          /usr/bin/python3 tools/ci_run.py dbus-run-session -- xvfb-run -a /usr/bin/python3 -m tools.check_alpha_ui | tee native-input-results.log
          /usr/bin/python3 tools/ci_run.py dbus-run-session -- xvfb-run -a /usr/bin/python3 -m tools.check_popover_dismissal | tee native-popover-results.log
          /usr/bin/python3 tools/ci_run.py dbus-run-session -- xvfb-run -a /usr/bin/python3 -m tools.check_passage_actions /tmp/bible-actions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} /tmp/bible-actions-capture --synthetic --no-screenshots | tee native-actions-results.log
          /usr/bin/python3 tools/ci_run.py dbus-run-session -- xvfb-run -a /usr/bin/python3 -m tools.check_reading_ui | tee native-reading-results.log
          /usr/bin/python3 tools/ci_run.py dbus-run-session -- xvfb-run -a /usr/bin/python3 -m tools.check_scroll_sync | tee native-scroll-results.log
          /usr/bin/python3 tools/ci_run.py dbus-run-session -- xvfb-run -a /usr/bin/python3 -m tools.check_passage_note_cards /tmp/passage-note-cards.json | tee native-note-cards-results.log
          /usr/bin/python3 tools/ci_run.py dbus-run-session -- xvfb-run -a /usr/bin/python3 -m tools.check_annotation_workspace | tee native-annotation-workspace-results.log
          /usr/bin/python3 tools/ci_run.py dbus-run-session -- xvfb-run -a /usr/bin/python3 -m tools.check_chapter_notes | tee native-chapter-notes-results.log
      - name: Téléchargement CrossWire, fidélité SWORD et réouverture hors connexion
        if: success() || failure()
        env:
          BIBLE_OFFLINE_PREFIX: sudo unshare --net --
        run: |
          /usr/bin/python3 tools/ci_run.py /usr/bin/python3 -m tools.check_crosswire
          /usr/bin/python3 tools/ci_run.py /usr/bin/python3 -m tools.check_commentary

      - name: Commentaire affilié réel et suivi de verset hors connexion
        env:
          BIBLE_OFFLINE_PREFIX: sudo unshare --net --
          GSK_RENDERER: cairo
        run: |
          set -o pipefail
          /usr/bin/python3 tools/ci_run.py dbus-run-session -- xvfb-run -a /usr/bin/python3 -m tools.check_affiliated_commentary | tee affiliated-commentary.log

      - name: Conserver les résultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bible-test-results
          path: |
            test-results.log
            ui-fr-results.log
            native-input-results.log
            native-popover-results.log
            native-actions-results.log
            native-reading-results.log
            native-scroll-results.log
            native-note-cards-results.log
            native-annotation-workspace-results.log
            native-chapter-notes-results.log
            affiliated-commentary.log
            affiliated-commentary-result.json
          if-no-files-found: warn

  flatpak:
    needs: prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Installer Flatpak et le SDK GNOME
        run: |
          # Use the official archive with the established build dependencies.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils xvfb xauth dbus-x11
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49
      - name: Construire et vérifier SWORD dans le sandbox
        run: |
          # Build from the same project source layout shipped in the source archive.
          python3 -m tools.project_sources "$GITHUB_SHA" "$RUNNER_TEMP/Bible-source.tar"
          mkdir "$RUNNER_TEMP/bible-build-source"
          tar -xf "$RUNNER_TEMP/Bible-source.tar" -C "$RUNNER_TEMP/bible-build-source"
          /usr/bin/python3 tools/ci_run.py flatpak-builder --user --repo=local-repo --force-clean build-dir "$RUNNER_TEMP/bible-build-source/packaging/io.github.icfmp.Bible.json"
          flatpak-builder --run build-dir "$RUNNER_TEMP/bible-build-source/packaging/io.github.icfmp.Bible.json" env PYTHONPATH=/app/lib/bible-python python3 -c 'import Sword; from bible.sword_provider import Reader; from bible.ui import Window; print(Sword.VerseKey("John.1.1").getOSISRef())'
      - name: Créer et installer le paquet alpha pour vérification
        run: |
          flatpak build-bundle local-repo Bible-alpha.flatpak io.github.icfmp.Bible --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive ./Bible-alpha.flatpak
          flatpak run --user --env=PYTHONPATH=/app/lib/bible-python --command=python3 io.github.icfmp.Bible -c 'import Sword; from bible.ui import Window; print("Bundle OK")'
      - name: Vérifier les cartes et brouillons dans le Flatpak installé
        run: |
          set -o pipefail
          dbus-run-session -- xvfb-run -a flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=cairo --command=python3 io.github.icfmp.Bible -c 'import inspect, unittest; from bible.ui import Window; assert inspect.getfile(Window).startswith("/app/"); suite=unittest.defaultTestLoader.loadTestsFromNames(["tests.test_passage_note_cards", "tests.test_note_citations", "tests.test_study_references", "tests.test_reference_data", "tests.test_library_polish", "tests.test_library_startup", "tests.test_annotation_workspace", "tests.test_chapter_notes", "tests.test_notes", "tests.test_finishing", "tests.test_personal_backup", "tests.test_personal_backup_ui", "tests.test_visual_polish", "tests.test_appearance"]); result=unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(not result.wasSuccessful())' 2>&1 | tee packaged-note-cards-results.log
          dbus-run-session -- xvfb-run -a flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=cairo --env=BIBLE_TEST_ISOLATED_CLICK=1 --command=python3 io.github.icfmp.Bible -m unittest tests.test_immersion -v 2>&1 | tee -a packaged-note-cards-results.log
          dbus-run-session -- xvfb-run -a flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=cairo --command=python3 io.github.icfmp.Bible -c 'import inspect; from bible.ui import Window; assert inspect.getfile(Window).startswith("/app/"); from tools.check_annotation_workspace import main; main()' 2>&1 | tee packaged-annotation-workspace-results.log
          dbus-run-session -- xvfb-run -a flatpak run --user --cwd=/tmp --filesystem="$PWD":ro --env=PYTHONPATH="/app/lib/bible-python:$PWD" --env=GSK_RENDERER=cairo --command=python3 io.github.icfmp.Bible -c 'import inspect; from bible.ui import Window; assert inspect.getfile(Window).startswith("/app/"); from tools.check_chapter_notes import main; main()' 2>&1 | tee packaged-chapter-notes-results.log
      - name: Identifier le paquet et calculer sa somme
        env:
          PREREQUISITES_RESULT: ${{ needs.prerequisites.result }}
        run: |
          sha256sum Bible-alpha.flatpak > SHA256SUMS
          python3 - <<'PYTHON'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert commit == os.environ['GITHUB_SHA']
          assert platform.machine() == 'x86_64'
          assert os.environ['PREREQUISITES_RESULT'] == 'success'
          ref = subprocess.check_output(['flatpak', 'info', '--user', '--show-ref', 'io.github.icfmp.Bible'], text=True).strip()
          assert ref.split('/')[2] == 'x86_64'
          Path('build-info.json').write_text(json.dumps({
              'commit': commit, 'architecture': 'x86_64', 'flatpak_ref': ref,
              'prerequisites': os.environ['PREREQUISITES_RESULT'],
              'ci': 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'],
              'sha256': hashlib.sha256(Path('Bible-alpha.flatpak').read_bytes()).hexdigest(),
          }, indent=2) + '\n')
          PYTHON
      - name: Mettre le paquet alpha à disposition
        uses: actions/upload-artifact@v4
        with:
          name: Bible-alpha-linux-x86_64
          path: |
            Bible-alpha.flatpak
            SHA256SUMS
            build-info.json
            packaged-note-cards-results.log
            packaged-annotation-workspace-results.log
            packaged-chapter-notes-results.log
          if-no-files-found: error
          retention-days: 30

  verification-report:
    if: always() && github.ref == 'refs/heads/feat/11-commentary-sources'
    needs: [prerequisites, flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: Bible-test-results
          path: results
      - name: Conserver les résultats réels avec le commit
        env:
          PREREQUISITES_RESULT: ${{ needs.prerequisites.result }}
          FLATPAK_RESULT: ${{ needs.flatpak.result }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          report = {'commit': os.environ['GITHUB_SHA'], 'run': os.environ['GITHUB_RUN_ID'],
                    'prerequisites': os.environ['PREREQUISITES_RESULT'], 'flatpak': os.environ['FLATPAK_RESULT']}
          for path in Path('results').glob('*'):
              if path.is_file():
                  report[path.name] = path.read_text()[-14000:]
          Path('/tmp/verification-report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2))
          PYTHON
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin refs/notes/verification:refs/notes/verification || true
          git notes --ref=verification add -f -F /tmp/verification-report.json "$GITHUB_SHA"
          git push origin refs/notes/verification
