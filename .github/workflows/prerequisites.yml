name: Vérifier le socle GNOME

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prerequisites:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
      - name: Consulter les recommandations GNOME actuelles
        run: /usr/bin/python3 tools/inspect_gnome_hig.py
      - name: Examiner les sources officielles CrossWire et YouVersion
        run: /usr/bin/python3 -m tools.inspect_sources
      - name: Installer GTK 4, libadwaita et Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 flatpak flatpak-builder python3-sword xvfb xauth dbus-x11
      - name: Examiner les paquets SWORD disponibles
        run: |
          apt-cache search --names-only 'sword|libsword' | head -80
      - name: Vérifier les dépendances et les accès réseau
        run: |
          /usr/bin/python3 tools/check_environment.py --network
      - name: Tests locaux et fenêtre GTK sous Xvfb
        run: |
          /usr/bin/python3 tools/ci_run.py dbus-run-session -- xvfb-run -a /usr/bin/python3 -m unittest discover -v
          LANGUAGE=fr /usr/bin/python3 tools/ci_run.py dbus-run-session -- xvfb-run -a /usr/bin/python3 -m unittest tests.test_ui -v
      - name: Téléchargement CrossWire, fidélité SWORD et réouverture hors connexion
        if: success() || failure()
        env:
          BIBLE_OFFLINE_PREFIX: sudo unshare --net --
        run: |
          /usr/bin/python3 tools/ci_run.py /usr/bin/python3 -m tools.check_crosswire

  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Installer Flatpak et le SDK GNOME
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49
      - name: Construire et vérifier SWORD dans le sandbox
        run: |
          /usr/bin/python3 tools/ci_run.py flatpak-builder --user --force-clean build-dir packaging/io.github.icfmp.Bible.json
          flatpak-builder --run build-dir packaging/io.github.icfmp.Bible.json env PYTHONPATH=/app/lib/bible-python python3 -c 'import Sword; from bible.sword_provider import Reader; from bible.ui import Window; print(Sword.VerseKey("John.1.1").getOSISRef())'
